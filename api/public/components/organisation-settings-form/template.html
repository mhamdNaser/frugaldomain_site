<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organisation settings</title>
<style>
:root{
  --acc:#475569;--acc-dk:#3e4b5c;--acc-soft:rgba(71,85,105,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:620px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(140deg,var(--acc),var(--acc-dk));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;flex:none}
.danger{border:1px solid var(--bad);border-radius:14px;padding:16px;display:grid;gap:12px}
.danger h3{color:var(--bad)}
.danger .row{justify-content:space-between;gap:14px;flex-wrap:wrap}
.danger .btn{border-color:var(--bad);color:var(--bad)}
.danger .btn:hover{background:var(--bad);color:#fff}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Organisation</h2><p class="sub">Applies to everyone in this workspace</p></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div class="row" style="gap:16px;flex-wrap:wrap"><span class="logo">A</span><div><div class="row" style="gap:8px"><button class="btn" type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 21V9M7 13l5-5 5 5M4 4h16"/></svg>Upload logo</button><button class="btn gh" type="button">Remove</button></div><p class="hint">Square SVG or PNG, at least 512×512.</p></div></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="orgname">Organisation name</label><input class="in" id="orgname" name="orgname" type="text" placeholder="Acme Design" ></div><div><label class="lb" for="orgslug">Workspace URL</label><input class="in" id="orgslug" name="orgslug" type="text" placeholder="acme" ><p class="hint">frugal.app/<b>acme</b></p></div></div><div><label class="lb" for="orgsite">Website</label><span style="position:relative;display:block"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M10 13a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 4.3l-1.7 1.7"/><path d="M14 11a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 19.7l1.7-1.7"/></svg></span><input class="in" id="orgsite" name="orgsite" type="url" placeholder="https://acme.design" style="padding-left:38px" ></span></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"><div><label class="lb" for="orglang">Default language</label><select class="in" id="orglang" name="orglang" ><option>English</option><option>العربية</option><option>Français</option></select></div><div><label class="lb" for="orgtz">Timezone</label><select class="in" id="orgtz" name="orgtz" ><option>Asia/Riyadh</option><option>Asia/Amman</option><option>Africa/Cairo</option><option>Europe/London</option></select></div><div><label class="lb" for="orgcur">Currency</label><select class="in" id="orgcur" name="orgcur" ><option>SAR</option><option>USD</option><option>EUR</option><option>JOD</option></select></div></div><div><label class="lb" for="orgvat">Tax registration number <span class="mut" style="font-weight:500">(optional)</span></label><input class="in" id="orgvat" name="orgvat" type="text" placeholder="Appears on invoices" ></div><div class="danger"><h3>Danger zone</h3><div class="row"><span><b style="display:block;font-size:13.5px">Transfer ownership</b><span class="xs mut">Hand this workspace to another admin</span></span><button class="btn" type="button">Transfer</button></div><div class="row"><span><b style="display:block;font-size:13.5px">Delete organisation</b><span class="xs mut">Removes every project, file and member. This cannot be undone.</span></span><button class="btn" type="button">Delete</button></div></div></form><div class="ft"><span></span><span class="row" style="gap:8px"><button class="btn" type="button">Discard changes</button><button class="btn pri" type="submit">Save settings</button></span></div></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dir=q.get('dir');
  if(dir==='rtl'||dir==='ltr')document.documentElement.dir=dir;
  if(dir==='rtl')document.documentElement.lang='ar';
  var theme=q.get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
})();
</script>
</body>
</html>
