<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onboarding goals form</title>
<style>
:root{
  --acc:#0891b2;--acc-dk:#07809d;--acc-soft:rgba(8,145,178,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:640px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.goals{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.goal{position:relative;border:1px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;display:block}
.goal:hover{border-color:var(--acc)}
.goal input{position:absolute;opacity:0}
.goal .t{display:block;font-weight:650;font-size:13.5px;margin-top:10px}
.goal .d{display:block;font-size:11.5px;color:var(--mut);margin-top:3px}
.goal:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.goal .tick{position:absolute;top:12px;inset-inline-end:12px;opacity:0;color:var(--acc)}
.goal:has(input:checked) .tick{opacity:1}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>What brings you here?</h2><p class="sub">Pick up to three - it shapes what we show you first</p></div></div><form class="pad" onsubmit="return false"><div class="goals"><label class="goal"><input type="checkbox"><span class="tick"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg></span><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:12px;background:rgba(37,99,235,0.13);color:#2563eb"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></span><span class="t">Build a dashboard</span><span class="d">Stat tiles, charts and tables</span></label><label class="goal"><input type="checkbox"><span class="tick"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg></span><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:12px;background:rgba(124,58,237,0.13);color:#7c3aed"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16Z"/></svg></span><span class="t">Draw and illustrate</span><span class="d">Vector editing in the browser</span></label><label class="goal"><input type="checkbox"><span class="tick"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg></span><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:12px;background:rgba(5,150,105,0.13);color:#059669"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 3-2 4 3"/></svg></span><span class="t">Find icons</span><span class="d">Thousands, free to use</span></label><label class="goal"><input type="checkbox"><span class="tick"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg></span><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:12px;background:rgba(217,119,6,0.13);color:#d97706"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m9 8-5 4 5 4M15 8l5 4-5 4"/></svg></span><span class="t">Grab components</span><span class="d">Single-file templates to copy</span></label><label class="goal"><input type="checkbox"><span class="tick"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg></span><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:12px;background:rgba(8,145,178,0.13);color:#0891b2"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></span><span class="t">Convert files</span><span class="d">Images, audio and documents</span></label><label class="goal"><input type="checkbox"><span class="tick"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg></span><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:12px;background:rgba(219,39,119,0.13);color:#db2777"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><path d="M17 5.2a3.5 3.5 0 0 1 0 6.6M18 20h4a5.4 5.4 0 0 0-3-4.9"/></svg></span><span class="t">Work with a team</span><span class="d">Shared libraries and reviews</span></label></div></form><div class="ft"><span id="count">0 of 3 chosen</span><span class="row" style="gap:8px"><button class="btn" type="button">Skip</button><button class="btn pri" type="button" id="next">Continue</button></span></div></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dir=q.get('dir');
  if(dir==='rtl'||dir==='ltr')document.documentElement.dir=dir;
  if(dir==='rtl')document.documentElement.lang='ar';
  var theme=q.get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
})();
</script>
<script>
const limit=3;
const boxes=[...document.querySelectorAll('.goal input')];
const counter=document.getElementById('count');
const next=document.getElementById('next');
function refresh(){
  const picked=boxes.filter(box=>box.checked).length;
  counter.textContent=picked+' of '+limit+' chosen';
  next.disabled=picked===0;
  boxes.forEach(box=>box.disabled=!box.checked&&picked>=limit);
}
boxes.forEach(box=>box.addEventListener('change',refresh));
refresh();
</script>
</body>
</html>
