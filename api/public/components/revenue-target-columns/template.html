<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Actual against target columns</title>
<style>
:root{
  --acc:#1d4ed8;--acc-dk:#1a45be;--acc-soft:rgba(29,78,216,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:860px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.vars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:0 20px 18px;text-align:center}
.vars span{font-size:11.5px;font-variant-numeric:tabular-nums}
.vars b{display:block;font-size:10px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.pos{color:var(--ok);font-weight:700}
.neg{color:var(--bad);font-weight:700}
</style>
</head>
<body>

ans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif">$210</text><line x1="42" y1="10" x2="792" y2="10" stroke="var(--bd)" stroke-width="1"/><text x="34" y="13.5" text-anchor="end" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif">$280</text><text x="104.5" y="232" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif">Jul</text><rect x="65.75" y="77.03" width="37.75" height="136.97" rx="4" fill="#2a78d6"><title>Actual · Jul: $188</title></rect><rect x="105.5" y="61" width="37.75" height="153" rx="4" fill="#eb6834"><title>Target · Jul: $210</title></rect><text x="229.5" y="232" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif">Aug</text><rect x="190.75" y="63.91" width="37.75" height="150.09" rx="4" fill="#2a78d6"><title>Actual · Aug: $206</title></rect><rect x="230.5" y="57.36" width="37.75" height="156.64" rx="4" fill="#eb6834"><title>Target · Aug: $215</title></rect><text x="354.5" y="232" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif">Sep</text><rect x="315.75" y="50.8" width="37.75" height="163.2" rx="4" fill="#2a78d6"><title>Actual · Sep: $224</title></rect><rect x="355.5" y="53.71" width="37.75" height="160.29" rx="4" fill="#eb6834"><title>Target · Sep: $220</title></rect><text x="479.5" y="232" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif">Oct</text><rect x="440.75" y="44.97" width="37.75" height="169.03" rx="4" fill="#2a78d6"><title>Actual · Oct: $232</title></rect><rect x="480.5" y="46.43" width="37.75" height="167.57" rx="4" fill="#eb6834"><title>Target · Oct: $230</title></rect><text x="604.5" y="232" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif">Nov</text><rect x="565.75" y="38.41" width="37.75" height="175.59" rx="4" fill="#2a78d6"><title>Actual · Nov: $241</title></rect><rect x="605.5" y="39.14" width="37.75" height="174.86" rx="4" fill="#eb6834"><title>Target · Nov: $240</title></rect><text x="729.5" y="232" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif">Dec</text><rect x="690.75" y="33.31" width="37.75" height="180.69" rx="4" fill="#2a78d6"><title>Actual · Dec: $248</title></rect><rect x="730.5" y="31.86" width="37.75" height="182.14" rx="4" fill="#eb6834"><title>Target · Dec: $250</title></rect></svg></div><div class="vars"><span><b>Jul</b><span class="neg">-10.5%</span></span><span><b>Aug</b><span class="neg">-4.2%</span></span><span><b>Sep</b><span class="pos">+1.8%</span></span><span><b>Oct</b><span class="pos">+0.9%</span></span><span><b>Nov</b><span class="pos">+0.4%</span></span><span><b>Dec</b><span class="neg">-0.8%</span></span></div></div></div>

</body>
