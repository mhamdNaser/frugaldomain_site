<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product review form</title>
<style>
:root{
  --acc:#f59e0b;--acc-dk:#d88b0a;--acc-soft:rgba(245,158,11,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.rate{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:5px}
.rate input{position:absolute;opacity:0}
.rate label{cursor:pointer;color:var(--bd)}
.rate label:hover,.rate label:hover ~ label,.rate input:checked ~ label{color:#f59e0b}
.prod{display:flex;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--soft)}
.prod .img{width:56px;height:56px;border-radius:12px;background:linear-gradient(140deg,#fbbf24,#f97316);flex:none}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Write a review</h2><p class="sub">Your review appears with your first name and initial</p></div><div class="row" style="gap:8px;flex-wrap:wrap"><span class="pill ok">Verified purchase</span></div></div><div class="prod"><span class="img"></span><span><span class="bold" style="display:block">Aurora Desk Lamp</span><span class="xs mut">Delivered 12 September 2026</span></span></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div><span class="lb">Your rating</span><div class="row" style="gap:12px"><div class="rate"><input type="radio" name="stars" id="r5" value="5"><label for="r5" aria-label="5 stars"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></label><input type="radio" name="stars" id="r4" value="4"><label for="r4" aria-label="4 stars"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></label><input type="radio" name="stars" id="r3" value="3"><label for="r3" aria-label="3 stars"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></label><input type="radio" name="stars" id="r2" value="2"><label for="r2" aria-label="2 stars"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></label><input type="radio" name="stars" id="r1" value="1"><label for="r1" aria-label="1 stars"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></label></div><span class="sm bold" id="word"></span></div></div><div><label class="lb" for="rheadline">Headline</label><input class="in" id="rheadline" name="rheadline" type="text" placeholder="Sum it up in a few words" ></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="rpros">What worked well</label><textarea class="in" id="rpros" name="rpros" rows="3" placeholder="Build quality, brightness..."></textarea></div><div><label class="lb" for="rcons">What did not</label><textarea class="in" id="rcons" name="rcons" rows="3" placeholder="Anything that disappointed"></textarea></div></div><div><label class="lb" for="photos">Add photos</label><input class="in" type="file" id="photos" accept="image/*" multiple style="padding:8px"><p class="hint" id="pcount">Up to 5 photos</p></div><label for="rrecommend" style="display:flex;align-items:flex-start;gap:9px;font-size:13px;cursor:pointer"><input type="checkbox" id="rrecommend" name="rrecommend" checked style="width:16px;height:16px;accent-color:var(--acc);margin-top:1px;flex:none"><span>I would recommend this product</span></label></form><div class="ft"><span>Reviews are checked before they appear</span><span class="row" style="gap:8px"><button class="btn" type="button">Cancel</button><button class="btn pri" type="submit">Publish review</button></span></div></div></div>
<script>
const words={1:'Poor',2:'Fair',3:'Good',4:'Very good',5:'Excellent'};
document.querySelectorAll('.rate input').forEach(input=>{
  input.addEventListener('change',()=>document.getElementById('word').textContent=words[input.value]);
});
document.getElementById('photos').addEventListener('change',event=>{
  const n=event.target.files.length;
  document.getElementById('pcount').textContent=n?n+' photo'+(n===1?'':'s')+' selected':'Up to 5 photos';
});
</script>
</body>
</html>
