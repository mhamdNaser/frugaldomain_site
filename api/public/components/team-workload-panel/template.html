<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team workload panel</title>
<style>
:root{
  --acc:#4f46e5;--acc-dk:#463eca;--acc-soft:rgba(79,70,229,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:720px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.ppl{display:grid;gap:18px}
.per{display:grid;gap:9px}
.per .top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.over{color:var(--bad);font-weight:700}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Workload</h2><p class="sub">Week 38 · 15 - 21 September</p></div><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn tiny " type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Rebalance</button></div></div><div class="pad"><div class="ppl"><div class="per"><div class="top"><span class="row" style="gap:10px"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;border-radius:50%;background:rgba(37,99,235,0.16);color:#2563eb;font-size:12.8px;font-weight:700;letter-spacing:.02em">OS</span><span><span class="bold" style="display:block">Omar Saleh</span><span class="xs mut">Engineering · 6 tasks</span></span></span><span class="num over">52h of 40h</span></div><span style="display:block;height:7px;border-radius:999px;background:var(--soft);overflow:hidden"><span style="display:block;height:100%;width:100%;border-radius:999px;background:#e11d48"></span></span></div><div class="per"><div class="top"><span class="row" style="gap:10px"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;border-radius:50%;background:rgba(5,150,105,0.16);color:#059669;font-size:12.8px;font-weight:700;letter-spacing:.02em">LH</span><span><span class="bold" style="display:block">Lina Haddad</span><span class="xs mut">Design · 4 tasks</span></span></span><span class="num bold">36h of 40h</span></div><span style="display:block;height:7px;border-radius:999px;background:var(--soft);overflow:hidden"><span style="display:block;height:100%;width:90%;border-radius:999px;background:#2a78d6"></span></span></div><div class="per"><div class="top"><span class="row" style="gap:10px"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;border-radius:50%;background:rgba(5,150,105,0.16);color:#059669;font-size:12.8px;font-weight:700;letter-spacing:.02em">MR</span><span><span class="bold" style="display:block">Maya Rahman</span><span class="xs mut">QA · 9 tasks</span></span></span><span class="num over">44h of 40h</span></div><span style="display:block;height:7px;border-radius:999px;background:var(--soft);overflow:hidden"><span style="display:block;height:100%;width:100%;border-radius:999px;background:#e11d48"></span></span></div><div class="per"><div class="top"><span class="row" style="gap:10px"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;border-radius:50%;background:rgba(217,119,6,0.16);color:#d97706;font-size:12.8px;font-weight:700;letter-spacing:.02em">SA</span><span><span class="bold" style="display:block">Sara Aziz</span><span class="xs mut">Content · 3 tasks</span></span></span><span class="num bold">22h of 40h</span></div><span style="display:block;height:7px;border-radius:999px;background:var(--soft);overflow:hidden"><span style="display:block;height:100%;width:55%;border-radius:999px;background:#2a78d6"></span></span></div><div class="per"><div class="top"><span class="row" style="gap:10px"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;border-radius:50%;background:rgba(8,145,178,0.16);color:#0891b2;font-size:12.8px;font-weight:700;letter-spacing:.02em">KN</span><span><span class="bold" style="display:block">Karim Nasser</span><span class="xs mut">Support · 5 tasks</span></span></span><span class="num bold">38h of 40h</span></div><span style="display:block;height:7px;border-radius:999px;background:var(--soft);overflow:hidden"><span style="display:block;height:100%;width:95%;border-radius:999px;background:#2a78d6"></span></span></div></div></div><div class="ft"><span>2 people over capacity</span><span>Team utilisation 96%</span></div></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dir=q.get('dir');
  if(dir==='rtl'||dir==='ltr')document.documentElement.dir=dir;
  if(dir==='rtl')document.documentElement.lang='ar';
  var theme=q.get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
})();
</script>
</body>
</html>
