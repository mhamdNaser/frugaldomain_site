<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice builder form</title>
<style>
:root{
  --acc:#4f46e5;--acc-dk:#463eca;--acc-soft:rgba(79,70,229,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:720px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.ln{display:grid;grid-template-columns:2.2fr .7fr .9fr .9fr auto;gap:9px;align-items:center}
.ln .in{padding:8px 10px;font-size:13px}
.ln .amt{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.lnhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700}
.rm{border:1px solid var(--bd);border-radius:9px;background:var(--card);padding:8px;cursor:pointer;color:var(--mut);display:inline-flex}
.rm:hover{border-color:var(--bad);color:var(--bad)}
.sums{display:grid;gap:8px;margin-left:auto;width:min(300px,100%)}
.sums div{display:flex;justify-content:space-between;font-size:13px}
.sums .t{border-top:1px dashed var(--bd);padding-top:9px;font-size:16px;font-weight:700;color:var(--acc)}
@media (max-width:620px){.ln{grid-template-columns:1fr 1fr}.lnhead{display:none}}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>New invoice</h2><p class="sub">INV-2282 · draft</p></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"><div><label class="lb" for="client">Bill to</label><select class="in" id="client" name="client" ><option>Northwind Ltd</option><option>Bluebird Media</option><option>Harbor Studio</option><option>Juno Labs</option></select></div><div><label class="lb" for="issued">Issue date</label><input class="in" id="issued" name="issued" type="date" value="2026-09-20"></div><div><label class="lb" for="due">Due date</label><input class="in" id="duedate" name="duedate" type="date" value="2026-10-20"></div></div><div><div class="ln lnhead"><span>Description</span><span>Qty</span><span>Rate</span><span style="text-align:right">Amount</span><span></span></div><div id="lines" style="display:grid;gap:9px;margin-top:8px"><div class="ln"><input class="in" placeholder="What are you billing for?" aria-label="Description" value="Design retainer"><input class="in q" inputmode="decimal" aria-label="Quantity" value="1"><input class="in r" inputmode="decimal" aria-label="Rate" value="6000"><span class="amt">$0.00</span><button class="rm" type="button" aria-label="Remove line"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div><div class="ln"><input class="in" placeholder="What are you billing for?" aria-label="Description" value="Front-end development"><input class="in q" inputmode="decimal" aria-label="Quantity" value="48"><input class="in r" inputmode="decimal" aria-label="Rate" value="95"><span class="amt">$0.00</span><button class="rm" type="button" aria-label="Remove line"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div></div><button class="btn tiny" type="button" id="addline" style="margin-top:10px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 5v14M5 12h14"/></svg>Add line</button></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="vat">Tax rate (%)</label><input class="in" id="vat" name="vat" type="text" placeholder="15" inputmode="decimal" value="15"></div><div><label class="lb" for="terms">Payment terms</label><select class="in" id="terms" name="terms" ><option>Net 30</option><option>Net 14</option><option>Due on receipt</option><option>Net 60</option></select></div></div><div class="sums"><div><span class="mut">Subtotal</span><span class="num" id="sub">$0.00</span></div><div><span class="mut">Tax</span><span class="num" id="tax">$0.00</span></div><div class="t"><span>Amount due</span><span class="num" id="due">$0.00</span></div></div></form><div class="ft"><span></span><span class="row" style="gap:8px"><button class="btn" type="button">Save draft</button><button class="btn pri" type="submit">Send invoice</button></span></div></div></div>
<script>
const rows=document.getElementById('lines');
function money(value){return '$'+value.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function recalc(){
  let subtotal=0;
  rows.querySelectorAll('.ln').forEach(row=>{
    const qty=parseFloat(row.querySelector('.q').value)||0;
    const rate=parseFloat(row.querySelector('.r').value)||0;
    const amount=qty*rate;
    row.querySelector('.amt').textContent=money(amount);
    subtotal+=amount;
  });
  const tax=subtotal*(parseFloat(document.getElementById('vat').value)||0)/100;
  document.getElementById('sub').textContent=money(subtotal);
  document.getElementById('tax').textContent=money(tax);
  document.getElementById('due').textContent=money(subtotal+tax);
}
rows.addEventListener('input',recalc);
document.getElementById('vat').addEventListener('input',recalc);
document.getElementById('addline').addEventListener('click',()=>{
  const row=rows.firstElementChild.cloneNode(true);
  row.querySelectorAll('input').forEach(input=>input.value='');
  row.querySelector('.amt').textContent=money(0);
  rows.appendChild(row);
});
rows.addEventListener('click',event=>{
  const button=event.target.closest('.rm');
  if(button&&rows.children.length>1){button.closest('.ln').remove();recalc();}
});
recalc();
</script>
</body>
</html>
