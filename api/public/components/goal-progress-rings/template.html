<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goal progress rings</title>
<style>
:root{
  --acc:#d97706;--acc-dk:#bf6905;--acc-soft:rgba(217,119,6,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:900px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap"><div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><div class="pad" style="text-align:center"><div style="display:flex;justify-content:center"><svg viewBox="0 0 118 118" width="118" height="118" aria-hidden="true" style="display:block"><circle cx="59" cy="59" r="52.5" fill="none" stroke="var(--soft)" stroke-width="13"/><circle cx="59" cy="59" r="52.5" fill="none" stroke="#2a78d6" stroke-width="13" stroke-linecap="round" stroke-dasharray="244.1 85.77" transform="rotate(-90 59 59)"/><text x="50%" y="55%" text-anchor="middle" fill="var(--ink)" font-size="28" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">74%</text></svg></div><h3 style="margin-top:14px">New customers</h3><div class="num" style="font-size:15px;font-weight:650;margin-top:5px">148 of 200</div><div style="margin-top:12px;display:flex;justify-content:center"><span class="pill ok"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Ahead of pace</span></div><div class="xs mut" style="margin-top:8px">11 days left</div></div></div><div class="card"><div class="pad" style="text-align:center"><div style="display:flex;justify-content:center"><svg viewBox="0 0 118 118" width="118" height="118" aria-hidden="true" style="display:block"><circle cx="59" cy="59" r="52.5" fill="none" stroke="var(--soft)" stroke-width="13"/><circle cx="59" cy="59" r="52.5" fill="none" stroke="#eb6834" stroke-width="13" stroke-linecap="round" stroke-dasharray="201.22 128.65" transform="rotate(-90 59 59)"/><text x="50%" y="55%" text-anchor="middle" fill="var(--ink)" font-size="28" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">61%</text></svg></div><h3 style="margin-top:14px">Revenue</h3><div class="num" style="font-size:15px;font-weight:650;margin-top:5px">182 of 300</div><div style="margin-top:12px;display:flex;justify-content:center"><span class="pill warn"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Slightly behind</span></div><div class="xs mut" style="margin-top:8px">11 days left</div></div></div><div class="card"><div class="pad" style="text-align:center"><div style="display:flex;justify-content:center"><svg viewBox="0 0 118 118" width="118" height="118" aria-hidden="true" style="display:block"><circle cx="59" cy="59" r="52.5" fill="none" stroke="var(--soft)" stroke-width="13"/><circle cx="59" cy="59" r="52.5" fill="none" stroke="#1baf7a" stroke-width="13" stroke-linecap="round" stroke-dasharray="316.67 13.2" transform="rotate(-90 59 59)"/><text x="50%" y="55%" text-anchor="middle" fill="var(--ink)" font-size="28" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">96%</text></svg></div><h3 style="margin-top:14px">Support CSAT</h3><div class="num" style="font-size:15px;font-weight:650;margin-top:5px">91 of 95</div><div style="margin-top:12px;display:flex;justify-content:center"><span class="pill ok"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>On track</span></div><div class="xs mut" style="margin-top:8px">Measured monthly</div></div></div></div></div>
</body>
</html>
