<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in form</title>
<style>
:root{
  --acc:#2563eb;--acc-dk:#2157cf;--acc-soft:rgba(37,99,235,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:420px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div style="text-align:center;padding:26px 24px 6px"><span style="display:inline-flex;margin-bottom:14px"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:48px;height:48px;border-radius:15px;background:rgba(10,0,0,0.13);color:var(--acc)"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span></span><h1>Welcome back</h1><p class="sub" style="margin-top:6px">Sign in to your Frugal workspace</p></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div><label class="lb" for="email">Email address</label><span style="position:relative;display:block"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg></span><input class="in" id="email" name="email" type="email" placeholder="you@company.com" style="padding-left:38px" autocomplete="email" required></span></div><div><div class="row" style="justify-content:space-between"><label class="lb" for="password" style="margin:0">Password</label><a href="#" class="xs">Forgot?</a></div><div style="margin-top:6px"><span style="position:relative;display:block"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><input class="in" id="password" name="password" type="password" placeholder="Your password" style="padding-left:38px" autocomplete="current-password" required></span></div></div><label for="remember" style="display:flex;align-items:flex-start;gap:9px;font-size:13px;cursor:pointer"><input type="checkbox" id="remember" name="remember" checked style="width:16px;height:16px;accent-color:var(--acc);margin-top:1px;flex:none"><span>Keep me signed in for 30 days</span></label><button class="btn pri" type="submit" style="width:100%;padding:11px"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Sign in</button><div style="display:flex;align-items:center;gap:12px;color:var(--mut);font-size:12px"><span style="flex:1;height:1px;background:var(--bd)"></span>or continue with<span style="flex:1;height:1px;background:var(--bd)"></span></div><div class="row" style="gap:10px"><button class="btn" type="button" style="flex:1;min-width:120px"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg>Google</button><button class="btn" type="button" style="flex:1;min-width:120px"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m9 8-5 4 5 4M15 8l5 4-5 4"/></svg>GitHub</button></div></form><div class="ft" style="justify-content:center"><span>New here? <a href="#">Create an account</a></span></div></div></div>
</body>
</html>
