<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product filter panel</title>
<style>
:root{
  --acc:#7c3aed;--acc-dk:#6d33d1;--acc-soft:rgba(124,58,237,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:360px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.sec{padding:16px 20px;border-bottom:1px solid var(--bd)}
.sec:last-child{border-bottom:0}
.sec h4{margin-bottom:10px}
.sec label{display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 0;cursor:pointer}
.sec label input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
.sec .n{margin-left:auto;color:var(--mut);font-size:11.5px}
input[type=range]{width:100%;accent-color:var(--acc)}
.prices{display:flex;justify-content:space-between;font-size:12.5px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums}
.sw{display:flex;gap:9px;flex-wrap:wrap}
.sw input{position:absolute;opacity:0}
.sw span{display:block;width:28px;height:28px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px var(--bd)}
.sw input:checked+span{box-shadow:0 0 0 2px var(--acc),0 0 0 4px var(--acc-soft)}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Filters</h2><p class="sub">412 products</p></div><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn gh tiny" type="button">Clear all</button></div></div><form onsubmit="return false"><div class="sec"><h4>Price</h4><input type="range" id="price" min="0" max="500" value="240" aria-label="Maximum price"><div class="prices"><span>$0</span><span id="pmax">$240</span></div></div><div class="sec"><h4>Category</h4><label><input type="checkbox" checked>Lighting<span class="n">112</span></label><label><input type="checkbox">Seating<span class="n">88</span></label><label><input type="checkbox" checked>Tables<span class="n">64</span></label><label><input type="checkbox">Storage<span class="n">41</span></label><label><input type="checkbox">Textiles<span class="n">107</span></label></div><div class="sec"><h4>Colour</h4><div class="sw"><label><input type="radio" name="colour" aria-label="Black"><span style="background:#111827"></span></label><label><input type="radio" name="colour" checked aria-label="Sand"><span style="background:#e7d8c2"></span></label><label><input type="radio" name="colour" aria-label="Sage"><span style="background:#a3b8a5"></span></label><label><input type="radio" name="colour" aria-label="Terracotta"><span style="background:#c2703b"></span></label><label><input type="radio" name="colour" aria-label="Indigo"><span style="background:#4f46e5"></span></label></div></div><div class="sec"><h4>Rating</h4><label><input type="checkbox" checked><span class="row" style="gap:2px;color:#f59e0b"><span style=""><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style=""><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style=""><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style=""><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style=""><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span></span><span class="n">64</span></label><label><input type="checkbox"><span class="row" style="gap:2px;color:#f59e0b"><span style=""><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style=""><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style=""><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style=""><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style="opacity:.28"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span></span><span class="n">148</span></label><label><input type="checkbox"><span class="row" style="gap:2px;color:#f59e0b"><span style=""><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style=""><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style=""><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style="opacity:.28"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style="opacity:.28"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span></span><span class="n">96</span></label></div><div class="sec"><h4>Availability</h4><label><input type="checkbox" checked>In stock only<span class="n">388</span></label><label><input type="checkbox">On sale<span class="n">52</span></label></div></form><div class="ft"><button class="btn" type="button">Reset</button><button class="btn pri" type="button">Show 214 results</button></div></div></div>
<script>
const range=document.getElementById('price');
range.addEventListener('input',()=>document.getElementById('pmax').textContent='$'+range.value);
</script>
</body>
</html>
