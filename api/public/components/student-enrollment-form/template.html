<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student enrolment form</title>
<style>
:root{
  --acc:#7c3aed;--acc-dk:#6d33d1;--acc-soft:rgba(124,58,237,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:640px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.course{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--bd);border-radius:11px;cursor:pointer}
.course:hover{border-color:var(--acc)}
.course input{width:17px;height:17px;accent-color:var(--acc)}
.course .cr{margin-left:auto;font-size:12px;font-weight:700;color:var(--mut)}
.course:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.load{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:13px;font-weight:650}
.load.over{background:var(--bad-bg);color:var(--bad)}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Enrol for the autumn term</h2><p class="sub">Registration closes 30 September</p></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="sname">Student name</label><input class="in" id="sname" name="sname" type="text" placeholder="Full legal name" autocomplete="name"></div><div><label class="lb" for="sid">Student number</label><input class="in" id="sid" name="sid" type="text" placeholder="2026-10-214" ></div></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="prog">Programme</label><select class="in" id="prog" name="prog" ><option>Computer science BSc</option><option>Design BA</option><option>Business BBA</option><option>Engineering BEng</option></select></div><div><label class="lb" for="term">Term</label><select class="in" id="term" name="term" ><option>Autumn 2026</option><option>Spring 2027</option><option>Summer 2027</option></select></div></div><div><span class="lb">Courses</span><div style="display:grid;gap:9px"><label class="course"><input type="checkbox" data-credits="3" checked><span><b style="display:block;font-size:13.5px">CS 301 · Algorithms</b><span class="xs mut">Mon, Wed 09:00</span></span><span class="cr">3 cr</span></label><label class="course"><input type="checkbox" data-credits="4" checked><span><b style="display:block;font-size:13.5px">CS 320 · Databases</b><span class="xs mut">Tue, Thu 11:00</span></span><span class="cr">4 cr</span></label><label class="course"><input type="checkbox" data-credits="3"><span><b style="display:block;font-size:13.5px">DS 210 · Interface design</b><span class="xs mut">Mon 13:00</span></span><span class="cr">3 cr</span></label><label class="course"><input type="checkbox" data-credits="4"><span><b style="display:block;font-size:13.5px">MA 205 · Linear algebra</b><span class="xs mut">Sun, Tue 08:00</span></span><span class="cr">4 cr</span></label><label class="course"><input type="checkbox" data-credits="2"><span><b style="display:block;font-size:13.5px">EN 110 · Technical writing</b><span class="xs mut">Wed 15:00</span></span><span class="cr">2 cr</span></label></div></div><div class="load"><span id="credits">0 of 18 credit hours</span><span class="xs">Overload needs the dean&rsquo;s approval</span></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="gname">Guardian name <span class="mut" style="font-weight:500">(under 18)</span></label><input class="in" id="gname" name="gname" type="text" placeholder="If applicable" ></div><div><label class="lb" for="gphone">Guardian phone</label><input class="in" id="gphone" name="gphone" type="tel" placeholder="+966 5x xxx xxxx" ></div></div></form><div class="ft"><span>Timetable clashes are checked on submit</span><span class="row" style="gap:8px"><button class="btn" type="button">Save draft</button><button class="btn pri" type="submit">Submit enrolment</button></span></div></div></div>
<script>
const limit=18;
const boxes=[...document.querySelectorAll('.course input')];
function refresh(){
  const total=boxes.filter(box=>box.checked).reduce((sum,box)=>sum+Number(box.dataset.credits),0);
  document.getElementById('credits').textContent=total+' of '+limit+' credit hours';
  document.querySelector('.load').classList.toggle('over',total>limit);
}
boxes.forEach(box=>box.addEventListener('change',refresh));
refresh();
</script>
</body>
</html>
