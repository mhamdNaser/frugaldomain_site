<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up form</title>
<style>
:root{
  --acc:#059669;--acc-dk:#04845c;--acc-soft:rgba(5,150,105,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:440px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.rules{display:grid;gap:5px;margin-top:9px}
.rule{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut)}
.rule.ok{color:var(--ok)}
.bar{display:flex;gap:4px;margin-top:9px}
.bar i{flex:1;height:4px;border-radius:999px;background:var(--bd);transition:background .2s}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div style="text-align:center;padding:26px 24px 6px"><span style="display:inline-flex;margin-bottom:14px"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:48px;height:48px;border-radius:15px;background:rgba(10,0,0,0.13);color:var(--acc)"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span></span><h1>Create your account</h1><p class="sub" style="margin-top:6px">Free forever, no card needed</p></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="first">First name</label><input class="in" id="first" name="first" type="text" placeholder="Lina" autocomplete="given-name" required></div><div><label class="lb" for="last">Last name</label><input class="in" id="last" name="last" type="text" placeholder="Haddad" autocomplete="family-name" required></div></div><div><label class="lb" for="email">Work email</label><span style="position:relative;display:block"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg></span><input class="in" id="email" name="email" type="email" placeholder="you@company.com" style="padding-left:38px" autocomplete="email" required></span></div><div><label class="lb" for="password">Password</label><span style="position:relative;display:block"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><input class="in" id="password" name="password" type="password" placeholder="Choose a strong password" style="padding-left:38px" autocomplete="new-password" required></span><span class="bar"><i></i><i></i><i></i><i></i></span><div class="rules"><span class="rule" id="r1"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg>At least 10 characters</span><span class="rule" id="r2"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg>One capital letter</span><span class="rule" id="r3"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg>One number</span><span class="rule" id="r4"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg>One symbol</span></div></div><label for="terms" style="display:flex;align-items:flex-start;gap:9px;font-size:13px;cursor:pointer"><input type="checkbox" id="terms" name="terms" style="width:16px;height:16px;accent-color:var(--acc);margin-top:1px;flex:none"><span>I agree to the <a href="#">terms of service</a> and <a href="#">privacy policy</a></span></label><button class="btn pri" type="submit" style="width:100%;padding:11px" disabled><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Create account</button></form><div class="ft" style="justify-content:center"><span>Already registered? <a href="#">Sign in</a></span></div></div></div>
<script>
const password=document.getElementById('password');
const rules=[
  {el:document.getElementById('r1'),test:v=>v.length>=10},
  {el:document.getElementById('r2'),test:v=>/[A-Z]/.test(v)},
  {el:document.getElementById('r3'),test:v=>/[0-9]/.test(v)},
  {el:document.getElementById('r4'),test:v=>/[^A-Za-z0-9]/.test(v)},
];
const segments=[...document.querySelectorAll('.bar i')];
const colours=['#e11d48','#f59e0b','#0891b2','#059669'];
password.addEventListener('input',()=>{
  let score=0;
  rules.forEach(rule=>{
    const pass=rule.test(password.value);
    rule.el.classList.toggle('ok',pass);
    if(pass)score++;
  });
  segments.forEach((segment,i)=>{
    segment.style.background=i<score?colours[score-1]:'var(--bd)';
  });
});
document.getElementById('terms').addEventListener('change',event=>{
  document.querySelector('button[type=submit]').disabled=!event.target.checked;
});
</script>
</body>
</html>
