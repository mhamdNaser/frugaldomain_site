<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotel reservation form</title>
<style>
:root{
  --acc:#b45309;--acc-dk:#9e4908;--acc-soft:rgba(180,83,9,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:520px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--bd);border-radius:10px;padding:6px 8px}
.step button{width:30px;height:30px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.step button:hover{border-color:var(--acc);color:var(--acc)}
.step output{font-weight:700;font-variant-numeric:tabular-nums}
.est{display:grid;gap:8px;padding:14px 16px;border-radius:12px;background:var(--soft)}
.est div{display:flex;justify-content:space-between;font-size:13px}
.est .t{border-top:1px dashed var(--bd);padding-top:9px;font-weight:700;font-size:15px}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Reserve a room</h2><p class="sub">Marjan Hotel · Riyadh</p></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="cin">Check in</label><input class="in" id="cin" name="cin" type="date" value="2026-09-24"></div><div><label class="lb" for="cout">Check out</label><input class="in" id="cout" name="cout" type="date" value="2026-09-28"></div></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="adults">Adults</label><div class="step"><button type="button" data-by="-1" aria-label="Fewer adults"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M5 12h14"/></svg></button><output data-min="1">2</output><button type="button" data-by="1" aria-label="More adults"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 5v14M5 12h14"/></svg></button></div></div><div><label class="lb" for="children">Children</label><div class="step"><button type="button" data-by="-1" aria-label="Fewer children"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M5 12h14"/></svg></button><output data-min="0">0</output><button type="button" data-by="1" aria-label="More children"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 5v14M5 12h14"/></svg></button></div></div></div><div><label class="lb" for="room">Room type</label><select class="in" id="room" name="room" ><option>Deluxe king - SAR 420</option><option>Twin standard - SAR 360</option><option>Suite - SAR 780</option></select></div><div><label class="lb" for="requests">Special requests <span class="mut" style="font-weight:500">(optional)</span></label><textarea class="in" id="requests" name="requests" rows="3" placeholder="High floor, late check-in, cot..."></textarea></div><div class="est"><div><span class="mut" id="nights">4 nights at SAR 420.00</span><span class="num" id="sub">SAR 1,680.00</span></div><div><span class="mut">VAT and city tax (15%)</span><span class="num" id="tax">SAR 252.00</span></div><div class="t"><span>Total</span><span class="num" id="tot">SAR 1,932.00</span></div></div></form><div class="ft"><span>Free cancellation until 48h before</span><span class="row" style="gap:8px"><button class="btn" type="button">Change dates</button><button class="btn pri" type="submit">Reserve now</button></span></div></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dir=q.get('dir');
  if(dir==='rtl'||dir==='ltr')document.documentElement.dir=dir;
  if(dir==='rtl')document.documentElement.lang='ar';
  var theme=q.get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
})();
</script>
<script>
const rate=420;
function nights(){
  const a=new Date(document.getElementById('cin').value);
  const b=new Date(document.getElementById('cout').value);
  const n=Math.round((b-a)/86400000);
  return Number.isFinite(n)&&n>0?n:1;
}
function money(value){return 'SAR '+value.toLocaleString('en-US',{minimumFractionDigits:2});}
function refresh(){
  const n=nights();
  const room=rate*n;
  const tax=room*0.15;
  document.getElementById('nights').textContent=n+' night'+(n===1?'':'s')+' at '+money(rate);
  document.getElementById('sub').textContent=money(room);
  document.getElementById('tax').textContent=money(tax);
  document.getElementById('tot').textContent=money(room+tax);
}
['cin','cout'].forEach(id=>document.getElementById(id).addEventListener('change',refresh));
document.querySelectorAll('.step').forEach(stepper=>{
  const out=stepper.querySelector('output');
  stepper.querySelectorAll('button').forEach(button=>{
    button.addEventListener('click',()=>{
      const next=Number(out.textContent)+Number(button.dataset.by);
      out.textContent=String(Math.max(Number(out.dataset.min||0),next));
    });
  });
});
refresh();
</script>
</body>
</html>
