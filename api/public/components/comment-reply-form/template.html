<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comment reply form</title>
<style>
:root{
  --acc:#0891b2;--acc-dk:#07809d;--acc-soft:rgba(8,145,178,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:620px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.quote{display:flex;gap:11px;padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--soft)}
.quote .txt{font-size:13px;color:var(--mut);margin-top:4px}
.tabs{display:flex;gap:4px;padding:10px 14px 0}
.tabs button{border:0;background:none;padding:8px 13px;border-radius:9px 9px 0 0;font:inherit;font-size:12.5px;font-weight:650;color:var(--mut);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--soft);color:var(--ink)}
.tools{display:flex;gap:2px;padding:8px 14px;border-bottom:1px solid var(--bd);background:var(--soft);flex-wrap:wrap}
.tools button{border:0;background:none;padding:6px;border-radius:7px;cursor:pointer;color:var(--mut);display:inline-flex}
.tools button:hover{background:var(--card);color:var(--acc)}
.tools .sep{width:1px;background:var(--bd);margin:4px 5px}
#preview{display:none;padding:14px 20px;font-size:13.5px;min-height:110px}
#preview.on{display:block}
textarea.hide{display:none}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="quote"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;border-radius:50%;background:rgba(5,150,105,0.16);color:#059669;font-size:14.4px;font-weight:700;letter-spacing:.02em">MR</span><span><b>Maya Rahman</b> <span class="xs mut">· 2 hours ago</span><div class="txt">Could we keep the sparkline out of the compact table? At 28px rows it is more noise than signal.</div></span></div><div class="tabs"><button type="button" data-tab="write" aria-selected="true">Write</button><button type="button" data-tab="preview" aria-selected="false">Preview</button></div><div class="tools"><button type="button" aria-label="Bold"><b style="font-size:14px">B</b></button><button type="button" aria-label="Italic"><i style="font-size:14px">I</i></button><span class="sep"></span><button type="button" aria-label="Link"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M10 13a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 4.3l-1.7 1.7"/><path d="M14 11a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 19.7l1.7-1.7"/></svg></button><button type="button" aria-label="Code"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m9 8-5 4 5 4M15 8l5 4-5 4"/></svg></button><button type="button" aria-label="Bulleted list"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button><span class="sep"></span><button type="button" aria-label="Attach a file"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 21V9M7 13l5-5 5 5M4 4h16"/></svg></button></div><form onsubmit="return false"><textarea class="in" id="reply" rows="5" placeholder="Write a reply. Use @ to mention someone." style="border:0;border-radius:0;padding:14px 20px"></textarea><div id="preview"></div><div class="ft"><span class="xs">Markdown supported · @ to mention</span><span class="row" style="gap:8px"><button class="btn" type="button">Cancel</button><button class="btn pri" type="submit"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg>Reply</button></span></div></form></div></div>
<script>
const tabs=[...document.querySelectorAll('.tabs button')];
const box=document.getElementById('reply');
const preview=document.getElementById('preview');
tabs.forEach(tab=>{
  tab.addEventListener('click',()=>{
    tabs.forEach(t=>t.setAttribute('aria-selected','false'));
    tab.setAttribute('aria-selected','true');
    const showing=tab.dataset.tab==='preview';
    box.classList.toggle('hide',showing);
    preview.classList.toggle('on',showing);
    if(showing){
      preview.textContent=box.value.trim()||'Nothing to preview yet.';
    }
  });
});
</script>
</body>
</html>
