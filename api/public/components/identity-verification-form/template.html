<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Identity verification form</title>
<style>
:root{
  --acc:#0f766e;--acc-dk:#0d6861;--acc-soft:rgba(15,118,110,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:620px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.steps{list-style:none;display:flex;gap:0;margin:0;padding:16px 20px;border-bottom:1px solid var(--bd);overflow-x:auto}
.steps li{display:flex;align-items:center;gap:9px;flex:1;min-width:0;color:var(--mut);font-size:12.5px;font-weight:600}
.steps li::after{content:'';flex:1;height:2px;background:var(--bd);margin:0 10px;min-width:16px}
.steps li:last-child::after{display:none}
.steps .dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--soft);border:1px solid var(--bd);font-size:12px;font-weight:700;flex:none}
.steps .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .now{color:var(--ink)}
.steps .now .dot{background:var(--acc);border-color:var(--acc);color:#fff}
.steps .done{color:var(--ink)}
.steps .done .dot{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.steps .done::after{background:var(--ok)}
.slots{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.slot{border:2px dashed var(--bd);border-radius:14px;padding:22px 14px;text-align:center;cursor:pointer;transition:.15s}
.slot:hover{border-color:var(--acc);background:var(--acc-soft)}
.slot.has{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.slot input{display:none}
.needs{display:grid;gap:7px;font-size:12px;color:var(--mut)}
.needs span{display:flex;gap:8px;align-items:flex-start}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Verify your identity</h2><p class="sub">Required before withdrawals are enabled</p></div></div><ol class="steps"><li class="done"><span class="dot"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg></span><span class="lbl">Details</span></li><li class="now"><span class="dot">2</span><span class="lbl">Document</span></li><li class=""><span class="dot">3</span><span class="lbl">Selfie</span></li></ol><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="doctype">Document type</label><select class="in" id="doctype" name="doctype" ><option>National ID</option><option>Passport</option><option>Driving licence</option><option>Residence permit</option></select></div><div><label class="lb" for="docountry">Issuing country</label><select class="in" id="docountry" name="docountry" ><option>Saudi Arabia</option><option>Jordan</option><option>Egypt</option><option>United Arab Emirates</option></select></div></div><div><label class="lb" for="docnum">Document number</label><input class="in" id="docnum" name="docnum" type="text" placeholder="As printed on the document" ></div><div><span class="lb">Upload both sides</span><div class="slots"><label class="slot"><input type="file" accept="image/*" aria-label="Front of document"><span style="display:inline-flex;color:var(--acc)"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 3-2 4 3"/></svg></span><span class="bold" style="display:block;margin-top:8px">Front</span><span class="xs mut cap" style="display:block;margin-top:2px">JPG or PNG, under 8 MB</span></label><label class="slot"><input type="file" accept="image/*" aria-label="Back of document"><span style="display:inline-flex;color:var(--acc)"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 3-2 4 3"/></svg></span><span class="bold" style="display:block;margin-top:8px">Back</span><span class="xs mut cap" style="display:block;margin-top:2px">JPG or PNG, under 8 MB</span></label></div></div><div class="needs"><span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg>All four corners visible, nothing cropped</span><span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg>No glare across the photograph or the text</span><span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="m20 6-11 11-5-5"/></svg>Valid for at least three more months</span></div><label for="kycagree" style="display:flex;align-items:flex-start;gap:9px;font-size:13px;cursor:pointer"><input type="checkbox" id="kycagree" name="kycagree" style="width:16px;height:16px;accent-color:var(--acc);margin-top:1px;flex:none"><span>I confirm this document is mine and currently valid</span></label></form><div class="ft"><span>Checks usually finish within 10 minutes</span><span class="row" style="gap:8px"><button class="btn" type="button">Back</button><button class="btn pri" type="submit">Continue to selfie</button></span></div></div></div>
<script>
document.querySelectorAll('.slot').forEach(slot=>{
  const input=slot.querySelector('input');
  slot.addEventListener('click',()=>input.click());
  input.addEventListener('change',()=>{
    if(!input.files[0])return;
    slot.classList.add('has');
    slot.querySelector('.cap').textContent=input.files[0].name;
  });
});
</script>
</body>
</html>
