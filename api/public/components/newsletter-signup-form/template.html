<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newsletter signup</title>
<style>
:root{
  --acc:#db2777;--acc-dk:#c12269;--acc-soft:rgba(219,39,119,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.line{display:flex;gap:9px;flex-wrap:wrap}
.line .in{flex:1;min-width:200px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:6px 12px;border:1px solid var(--bd);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--mut);transition:.15s}
.chips label:hover span{border-color:var(--acc);color:var(--acc)}
.chips input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}
.proof{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="pad" style="padding:28px 24px"><span style="display:inline-flex;margin-bottom:14px"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;border-radius:14px;background:rgba(10,0,0,0.13);color:var(--acc)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg></span></span><h1>Design notes, every other Tuesday</h1><p class="sub" style="margin-top:6px;font-size:13.5px">Components, drawing tips and the occasional teardown. No more than two emails a month.</p></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div><span class="lb">What are you interested in?</span><div class="chips"><label><input type="checkbox" checked><span>Components</span></label><label><input type="checkbox" checked><span>Drawing editor</span></label><label><input type="checkbox"><span>Icons</span></label><label><input type="checkbox"><span>Release notes</span></label></div></div><div><label class="lb" for="email">Email address</label><div class="line"><input class="in" id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required><button class="btn pri" type="submit" style="padding:10px 18px">Subscribe</button></div></div><div class="proof"><span style="display:inline-flex;align-items:center"><span style="margin-left:0;border-radius:50%;box-shadow:0 0 0 2px var(--card)"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:rgba(5,150,105,0.16);color:#059669;font-size:10.4px;font-weight:700;letter-spacing:.02em">LH</span></span><span style="margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--card)"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:rgba(37,99,235,0.16);color:#2563eb;font-size:10.4px;font-weight:700;letter-spacing:.02em">OS</span></span><span style="margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--card)"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:rgba(5,150,105,0.16);color:#059669;font-size:10.4px;font-weight:700;letter-spacing:.02em">MR</span></span><span style="margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--card)"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:rgba(217,119,6,0.16);color:#d97706;font-size:10.4px;font-weight:700;letter-spacing:.02em">SA</span></span></span><span>Joining <b>12,480</b> designers and developers</span></div></form><div class="ft" style="justify-content:center"><span class="xs">Unsubscribe in one click, from any email</span></div></div></div>
</body>
</html>
