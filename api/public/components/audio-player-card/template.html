<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio player card</title>
<style>
:root{
  --acc:#7c3aed;--acc-dk:#6d33d1;--acc-soft:rgba(124,58,237,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.wave{display:flex;align-items:center;gap:2px;height:56px;cursor:pointer}
.wave i{flex:1;border-radius:999px;background:var(--bd);transition:background .1s}
.wave i.on{background:var(--acc)}
.transport{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px}
.transport button{border:1px solid var(--bd);background:var(--card);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.transport button:hover{border-color:var(--acc);color:var(--acc)}
.transport .main{width:50px;height:50px;background:var(--acc);border-color:var(--acc);color:#fff}
.transport .main:hover{color:#fff;filter:brightness(1.08)}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:7px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="pad"><div class="row" style="gap:14px"><span style="width:58px;height:58px;border-radius:14px;background:linear-gradient(140deg,#7c3aed,#4f46e5);flex:none"></span><span><b style="display:block;font-size:14.5px">Designing for the ninety-ninth percentile</b><span class="xs mut">Episode 42 · The Frugal Podcast</span></span></div><div class="wave" style="margin-top:18px"><i style="height:12px"></i><i style="height:29px"></i><i style="height:37px"></i><i style="height:43px"></i><i style="height:45px"></i><i style="height:53px"></i><i style="height:49px"></i><i style="height:42px"></i><i style="height:32px"></i><i style="height:20px"></i><i style="height:21px"></i><i style="height:30px"></i><i style="height:37px"></i><i style="height:42px"></i><i style="height:53px"></i><i style="height:51px"></i><i style="height:46px"></i><i style="height:38px"></i><i style="height:27px"></i><i style="height:24px"></i><i style="height:22px"></i><i style="height:31px"></i><i style="height:37px"></i><i style="height:50px"></i><i style="height:51px"></i><i style="height:49px"></i><i style="height:43px"></i><i style="height:34px"></i><i style="height:32px"></i><i style="height:19px"></i><i style="height:23px"></i><i style="height:31px"></i><i style="height:46px"></i><i style="height:49px"></i><i style="height:49px"></i><i style="height:46px"></i><i style="height:39px"></i><i style="height:39px"></i><i style="height:27px"></i><i style="height:15px"></i><i style="height:24px"></i><i style="height:40px"></i><i style="height:46px"></i><i style="height:48px"></i><i style="height:47px"></i><i style="height:43px"></i><i style="height:44px"></i><i style="height:34px"></i><i style="height:22px"></i><i style="height:16px"></i><i style="height:33px"></i><i style="height:41px"></i><i style="height:45px"></i><i style="height:47px"></i><i style="height:45px"></i><i style="height:49px"></i><i style="height:41px"></i><i style="height:30px"></i><i style="height:17px"></i><i style="height:26px"></i></div><div class="times"><span>14:08</span><span>-22:41</span></div><div class="transport"><button type="button" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><button class="main" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M9 5v14M15 5v14"/></svg></button><button type="button" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button><button type="button" aria-label="Playback speed" style="width:auto;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:700">1.25&times;</button></div></div></div></div>
<script>
const bars=[...document.querySelectorAll('.wave i')];
const wave=document.querySelector('.wave');
function seekTo(index){bars.forEach((bar,i)=>bar.classList.toggle('on',i<=index));}
wave.addEventListener('click',event=>{
  const ratio=(event.clientX-wave.getBoundingClientRect().left)/wave.clientWidth;
  seekTo(Math.round(ratio*bars.length));
});
seekTo(Math.round(bars.length * 0.38));
</script>
</body>
</html>
