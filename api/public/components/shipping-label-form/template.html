<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shipping label form</title>
<style>
:root{
  --acc:#7c3aed;--acc-dk:#6d33d1;--acc-soft:rgba(124,58,237,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:600px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.pick{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--bd);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--acc)}
.pick input{width:18px;height:18px;accent-color:var(--acc);flex:none}
.pick .body{flex:1}
.pick .t{display:block;font-weight:650;font-size:13.5px}
.pick .d{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.pick .m{font-weight:700;font-size:14px;white-space:nowrap}
.pick:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.vol{display:flex;justify-content:space-between;padding:11px 13px;border-radius:11px;background:var(--soft);font-size:13px;font-weight:650;margin-top:9px}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Create a shipping label</h2><p class="sub">Order #3104 · 3 items</p></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div><label class="lb" for="recipient">Deliver to</label><input class="in" id="recipient" name="recipient" type="text" placeholder="Rana Khalil, Al Nakheel, Riyadh 12388" ></div><div><span class="lb">Parcel size (cm)</span><div class="dims"><input class="in" id="l" name="l" type="text" placeholder="Length" inputmode="decimal" aria-label="Length in cm" value="40"><input class="in" id="w" name="w" type="text" placeholder="Width" inputmode="decimal" aria-label="Width in cm" value="30"><input class="in" id="h" name="h" type="text" placeholder="Height" inputmode="decimal" aria-label="Height in cm" value="20"></div><div class="vol"><span id="vol">0 kg volumetric</span><span class="mut" id="charged">Charged at 0 kg</span></div></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="kg">Actual weight (kg)</label><input class="in" id="kg" name="kg" type="text" placeholder="3.4" inputmode="decimal" value="3.4"></div><div><label class="lb" for="value">Declared value</label><input class="in" id="value" name="value" type="text" placeholder="248.00" inputmode="decimal"></div></div><div><span class="lb">Service</span><div style="display:grid;gap:10px;margin-top:2px"><label class="pick" for="svc1"><input type="radio" name="svc" id="svc1" checked><span class="body"><span class="t">Standard</span><span class="d">Delivered in 3 - 5 working days</span></span><span class="m">$8.40</span></label><label class="pick" for="svc2"><input type="radio" name="svc" id="svc2"><span class="body"><span class="t">Express</span><span class="d">Next working day before 17:00</span></span><span class="m">$21.00</span></label><label class="pick" for="svc3"><input type="radio" name="svc" id="svc3"><span class="body"><span class="t">Same day</span><span class="d">Within the city, before 21:00</span></span><span class="m">$34.00</span></label></div></div><label for="sig" style="display:flex;align-items:flex-start;gap:9px;font-size:13px;cursor:pointer"><input type="checkbox" id="sig" name="sig" checked style="width:16px;height:16px;accent-color:var(--acc);margin-top:1px;flex:none"><span>Require a signature on delivery</span></label><label for="ins" style="display:flex;align-items:flex-start;gap:9px;font-size:13px;cursor:pointer"><input type="checkbox" id="ins" name="ins" style="width:16px;height:16px;accent-color:var(--acc);margin-top:1px;flex:none"><span>Insure for the declared value (+$4.20)</span></label></form><div class="ft"><span>Label is a PDF, ready to print</span><span class="row" style="gap:8px"><button class="btn" type="button">Cancel</button><button class="btn pri" type="submit">Buy label</button></span></div></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dir=q.get('dir');
  if(dir==='rtl'||dir==='ltr')document.documentElement.dir=dir;
  if(dir==='rtl')document.documentElement.lang='ar';
  var theme=q.get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
})();
</script>
<script>
const fields=['l','w','h','kg'];
function calc(){
  const l=parseFloat(document.getElementById('l').value)||0;
  const w=parseFloat(document.getElementById('w').value)||0;
  const h=parseFloat(document.getElementById('h').value)||0;
  const actual=parseFloat(document.getElementById('kg').value)||0;
  const volumetric=(l*w*h)/5000;
  const charged=Math.max(actual,volumetric);
  document.getElementById('vol').textContent=volumetric.toFixed(2)+' kg volumetric';
  document.getElementById('charged').textContent='Charged at '+charged.toFixed(2)+' kg';
}
fields.forEach(id=>document.getElementById(id).addEventListener('input',calc));
calc();
</script>
</body>
</html>
