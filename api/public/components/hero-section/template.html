<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero section</title>
<style>
:root{
  --acc:#2563eb;--acc-dk:#2157cf;--acc-soft:rgba(37,99,235,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:980px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:38px;align-items:center;padding:44px 34px}
.hero h1{font-size:40px;line-height:1.1;letter-spacing:-.03em}
.hero .lede{font-size:16px;color:var(--mut);margin-top:16px;line-height:1.65;max-width:44ch}
.hero .acts{display:flex;gap:11px;margin-top:26px;flex-wrap:wrap}
.hero .proof{display:flex;align-items:center;gap:11px;margin-top:26px;font-size:12.5px;color:var(--mut)}
.shot{background:linear-gradient(140deg,var(--acc),var(--acc-dk) 60%,#0f172a);border-radius:18px;padding:18px;box-shadow:0 26px 60px -28px rgba(15,23,42,.7)}
.win{background:var(--card);border-radius:12px;overflow:hidden}
.winbar{display:flex;gap:5px;padding:9px 11px;border-bottom:1px solid var(--bd)}
.winbar i{width:9px;height:9px;border-radius:50%;background:var(--bd)}
.winbody{padding:14px;display:grid;gap:9px}
.ln{height:9px;border-radius:999px;background:var(--soft)}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding:32px 22px}.hero h1{font-size:31px}}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hero"><div><span class="pill info"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></svg>216 components and counting</span><h1 style="margin-top:16px">Interface templates you can read in one sitting</h1><p class="lede">Every component is a single HTML file. No build step, no dependencies, no CDN. Preview it, copy it, ship it.</p><div class="acts"><button class="btn pri" type="button" ><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Browse the gallery</button><button class="btn " type="button" ><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M8 5.5v13l11-6.5Z"/></svg>See how it works</button></div><div class="proof"><span style="display:inline-flex;align-items:center"><span style="margin-left:0;border-radius:50%;box-shadow:0 0 0 2px var(--card)"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:rgba(5,150,105,0.16);color:#059669;font-size:10.4px;font-weight:700;letter-spacing:.02em">LH</span></span><span style="margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--card)"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:rgba(37,99,235,0.16);color:#2563eb;font-size:10.4px;font-weight:700;letter-spacing:.02em">OS</span></span><span style="margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--card)"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:rgba(5,150,105,0.16);color:#059669;font-size:10.4px;font-weight:700;letter-spacing:.02em">MR</span></span><span style="margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--card)"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;border-radius:50%;background:rgba(217,119,6,0.16);color:#d97706;font-size:10.4px;font-weight:700;letter-spacing:.02em">SA</span></span></span><span>Used by <b>12,480</b> designers and developers</span></div></div><div class="shot"><div class="win"><div class="winbar"><i></i><i></i><i></i></div><div class="winbody"><div class="ln" style="width:52%"></div><div class="ln" style="width:88%;height:38px"></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px"><div class="ln" style="height:52px"></div><div class="ln" style="height:52px"></div><div class="ln" style="height:52px"></div></div><div class="ln" style="width:70%"></div><div class="ln" style="width:44%"></div></div></div></div></div></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dir=q.get('dir');
  if(dir==='rtl'||dir==='ltr')document.documentElement.dir=dir;
  if(dir==='rtl')document.documentElement.lang='ar';
  var theme=q.get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
})();
</script>
</body>
</html>
