<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour picker</title>
<style>
:root{
  --acc:#db2777;--acc-dk:#c12269;--acc-soft:rgba(219,39,119,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:420px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.sw button{aspect-ratio:1;border-radius:9px;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(15,23,42,.1)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
.preview{height:74px;border-radius:13px;margin-bottom:16px;box-shadow:inset 0 0 0 1px rgba(15,23,42,.1);display:flex;align-items:flex-end;justify-content:flex-end;padding:10px}
.preview code{background:rgba(15,23,42,.72);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.hexrow{display:flex;gap:8px}
.hexrow input[type=text]{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.hexrow input[type=color]{width:46px;padding:4px;height:42px}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Colour</h2></div></div><div class="pad"><div class="preview" style="background:#db2777"><code id="hexout">#DB2777</code></div><span class="lb">Palette</span><div class="sw palette"><button type="button" data-c="#0f172a" aria-pressed="false" aria-label="#0f172a" style="background:#0f172a"></button><button type="button" data-c="#475569" aria-pressed="false" aria-label="#475569" style="background:#475569"></button><button type="button" data-c="#94a3b8" aria-pressed="false" aria-label="#94a3b8" style="background:#94a3b8"></button><button type="button" data-c="#e11d48" aria-pressed="false" aria-label="#e11d48" style="background:#e11d48"></button><button type="button" data-c="#db2777" aria-pressed="true" aria-label="#db2777" style="background:#db2777"></button><button type="button" data-c="#7c3aed" aria-pressed="false" aria-label="#7c3aed" style="background:#7c3aed"></button><button type="button" data-c="#4f46e5" aria-pressed="false" aria-label="#4f46e5" style="background:#4f46e5"></button><button type="button" data-c="#2563eb" aria-pressed="false" aria-label="#2563eb" style="background:#2563eb"></button><button type="button" data-c="#0891b2" aria-pressed="false" aria-label="#0891b2" style="background:#0891b2"></button><button type="button" data-c="#0d9488" aria-pressed="false" aria-label="#0d9488" style="background:#0d9488"></button><button type="button" data-c="#059669" aria-pressed="false" aria-label="#059669" style="background:#059669"></button><button type="button" data-c="#16a34a" aria-pressed="false" aria-label="#16a34a" style="background:#16a34a"></button><button type="button" data-c="#65a30d" aria-pressed="false" aria-label="#65a30d" style="background:#65a30d"></button><button type="button" data-c="#d97706" aria-pressed="false" aria-label="#d97706" style="background:#d97706"></button><button type="button" data-c="#ea580c" aria-pressed="false" aria-label="#ea580c" style="background:#ea580c"></button><button type="button" data-c="#c2410c" aria-pressed="false" aria-label="#c2410c" style="background:#c2410c"></button></div><span class="lb" style="margin-top:16px">Recent</span><div class="sw" id="recent"><button type="button" data-c="#db2777" style="background:#db2777" aria-label="#db2777"></button></div><span class="lb" style="margin-top:16px">Hex</span><div class="hexrow"><input class="in" type="text" id="hex" value="#DB2777" aria-label="Hex colour"><input class="in" type="color" id="native" value="#db2777" aria-label="Open the system colour picker"></div></div></div></div>
<script>
const preview=document.querySelector('.preview');
const label=document.getElementById('hexout');
const hex=document.getElementById('hex');
const native=document.getElementById('native');
const recent=document.getElementById('recent');
function apply(value){
  preview.style.background=value;
  label.textContent=value.toUpperCase();
  hex.value=value.toUpperCase();
  native.value=value;
  if(![...recent.children].some(child=>child.dataset.c===value)){
    const dot=document.createElement('button');
    dot.type='button';dot.dataset.c=value;dot.style.background=value;
    dot.setAttribute('aria-label',value);
    dot.addEventListener('click',()=>apply(value));
    recent.prepend(dot);
    if(recent.children.length>8)recent.lastElementChild.remove();
  }
}
document.querySelectorAll('.palette button').forEach(button=>{
  button.addEventListener('click',()=>{
    document.querySelectorAll('.palette button').forEach(b=>b.setAttribute('aria-pressed','false'));
    button.setAttribute('aria-pressed','true');
    apply(button.dataset.c);
  });
});
native.addEventListener('input',()=>apply(native.value));
hex.addEventListener('change',()=>{if(/^#[0-9a-f]{6}$/i.test(hex.value))apply(hex.value.toLowerCase());});
</script>
</body>
</html>
