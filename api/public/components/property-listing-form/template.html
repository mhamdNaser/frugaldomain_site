<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Property listing form</title>
<style>
:root{
  --acc:#0f766e;--acc-dk:#0d6861;--acc-soft:rgba(15,118,110,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:680px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips input{position:absolute;opacity:0}
.chips span{display:inline-block;padding:7px 13px;border:1px solid var(--bd);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;transition:.15s}
.chips label:hover span{border-color:var(--acc);color:var(--acc)}
.chips input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photo{width:96px;height:72px;border-radius:11px;position:relative;overflow:hidden}
.photo b{position:absolute;left:6px;bottom:6px;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;background:rgba(15,23,42,.72);color:#fff;padding:2px 6px;border-radius:5px}
.addp{width:96px;height:72px;border:2px dashed var(--bd);border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--mut);cursor:pointer}
.addp:hover{border-color:var(--acc);color:var(--acc)}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>New listing</h2><p class="sub">Published listings appear within 10 minutes</p></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="ltitle">Listing title</label><input class="in" id="ltitle" name="ltitle" type="text" placeholder="Al Nakheel villa with garden" ></div><div><label class="lb" for="ltype">Property type</label><select class="in" id="ltype" name="ltype" ><option>Villa</option><option>Apartment</option><option>Townhouse</option><option>Land</option><option>Office</option><option>Retail unit</option></select></div></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"><div><label class="lb" for="lprice">Price</label><input class="in" id="lprice" name="lprice" type="text" placeholder="4,200,000" inputmode="numeric"></div><div><label class="lb" for="larea">Area (m²)</label><input class="in" id="larea" name="larea" type="text" placeholder="420" inputmode="numeric"></div><div><label class="lb" for="lpurpose">Purpose</label><select class="in" id="lpurpose" name="lpurpose" ><option>For sale</option><option>For rent</option><option>For investment</option></select></div></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"><div><label class="lb" for="lbeds">Bedrooms</label><select class="in" id="lbeds" name="lbeds" ><option>Studio</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select></div><div><label class="lb" for="lbaths">Bathrooms</label><select class="in" id="lbaths" name="lbaths" ><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select></div><div><label class="lb" for="lage">Age</label><select class="in" id="lage" name="lage" ><option>Off plan</option><option>New build</option><option>1 - 5 years</option><option>6 - 10 years</option><option>Over 10 years</option></select></div></div><div><label class="lb" for="laddress">Address</label><span style="position:relative;display:block"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg></span><input class="in" id="laddress" name="laddress" type="text" placeholder="District, street, city" style="padding-left:38px" ></span></div><div><label class="lb" for="ldesc">Description</label><textarea class="in" id="ldesc" name="ldesc" rows="4" placeholder="What makes this property worth seeing?"></textarea></div><div><span class="lb">Amenities</span><div class="chips"><label><input type="checkbox" checked><span>Private pool</span></label><label><input type="checkbox" checked><span>Garden</span></label><label><input type="checkbox"><span>Maid room</span></label><label><input type="checkbox"><span>Driver room</span></label><label><input type="checkbox" checked><span>Covered parking</span></label><label><input type="checkbox"><span>Elevator</span></label><label><input type="checkbox" checked><span>Central AC</span></label><label><input type="checkbox"><span>Kitchen appliances</span></label><label><input type="checkbox" checked><span>Security</span></label></div></div><div><span class="lb">Photos</span><div class="photos"><span class="photo" style="background:linear-gradient(140deg,#0f766e,#14b8a6)"><b>Cover</b></span><span class="photo" style="background:linear-gradient(140deg,#1d4ed8,#60a5fa)"></span><span class="photo" style="background:linear-gradient(140deg,#b45309,#f59e0b)"></span><span class="addp"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 5v14M5 12h14"/></svg></span></div><p class="hint">Drag to reorder. The first photo is used as the cover.</p></div></form><div class="ft"><span></span><span class="row" style="gap:8px"><button class="btn" type="button">Save draft</button><button class="btn pri" type="submit">Publish listing</button></span></div></div></div>
</body>
</html>
