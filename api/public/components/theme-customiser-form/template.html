<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theme customiser form</title>
<style>
:root{
  --acc:#db2777;--acc-dk:#c12269;--acc-soft:rgba(219,39,119,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:620px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.demo{padding:20px;border-bottom:1px solid var(--bd);background:var(--soft)}
.democard{background:var(--card);border:1px solid var(--bd);border-radius:var(--dr,14px);padding:var(--dp,18px);box-shadow:var(--sh)}
.democard .btn{background:var(--da,#db2777);border-color:var(--da,#db2777);color:#fff;border-radius:calc(var(--dr,14px) * .6)}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--bd)}
.swatches button[aria-pressed=true]{border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--acc)}
.val{font-size:12px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Customise the theme</h2><p class="sub">Applies to your public gallery</p></div></div><div class="demo"><div class="democard"><div class="row" style="gap:12px"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;border-radius:12px;background:rgba(10,0,0,0.13);color:var(--da,#db2777)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 3-2 4 3"/></svg></span><span><b style="display:block">Preview card</b><span class="xs mut">This is how your components will look</span></span></div><p class="sm mut" style="margin:14px 0">Every control below changes this card through CSS custom properties - the same mechanism your published theme uses.</p><button class="btn" type="button">Primary action</button></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div><span class="lb">Accent colour</span><div class="swatches"><button type="button" data-colour="#db2777" aria-pressed="true" aria-label="#db2777" style="background:#db2777"></button><button type="button" data-colour="#2563eb" aria-pressed="false" aria-label="#2563eb" style="background:#2563eb"></button><button type="button" data-colour="#059669" aria-pressed="false" aria-label="#059669" style="background:#059669"></button><button type="button" data-colour="#d97706" aria-pressed="false" aria-label="#d97706" style="background:#d97706"></button><button type="button" data-colour="#7c3aed" aria-pressed="false" aria-label="#7c3aed" style="background:#7c3aed"></button><button type="button" data-colour="#0891b2" aria-pressed="false" aria-label="#0891b2" style="background:#0891b2"></button><button type="button" data-colour="#e11d48" aria-pressed="false" aria-label="#e11d48" style="background:#e11d48"></button></div></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="hex">Or a specific colour</label><input class="in" type="color" id="hex" value="#db2777" style="height:44px;padding:5px"></div><div><label class="lb" for="font">Typeface</label><select class="in" id="font" name="font" ><option>System sans</option><option>Serif</option><option>Monospaced</option><option>Rounded</option></select></div></div><div><div class="row" style="justify-content:space-between"><label class="lb" for="radius" style="margin:0">Corner radius</label><span class="val" id="rval">14px</span></div><input type="range" id="radius" min="0" max="28" value="14"></div><div><div class="row" style="justify-content:space-between"><label class="lb" for="density" style="margin:0">Padding</label><span class="val" id="dval">18px</span></div><input type="range" id="density" min="8" max="32" value="18"></div></form><div class="ft"><span>Changes go live immediately</span><span class="row" style="gap:8px"><button class="btn" type="button">Reset</button><button class="btn pri" type="submit">Save theme</button></span></div></div></div>
<script>
const card=document.querySelector('.democard');
const radius=document.getElementById('radius');
const density=document.getElementById('density');
radius.addEventListener('input',()=>{
  card.style.setProperty('--dr',radius.value+'px');
  document.getElementById('rval').textContent=radius.value+'px';
});
density.addEventListener('input',()=>{
  card.style.setProperty('--dp',density.value+'px');
  document.getElementById('dval').textContent=density.value+'px';
});
document.querySelectorAll('.swatches button').forEach(button=>{
  button.addEventListener('click',()=>{
    document.querySelectorAll('.swatches button').forEach(b=>b.setAttribute('aria-pressed','false'));
    button.setAttribute('aria-pressed','true');
    card.style.setProperty('--da',button.dataset.colour);
    document.getElementById('hex').value=button.dataset.colour;
  });
});
document.getElementById('hex').addEventListener('input',event=>{
  card.style.setProperty('--da',event.target.value);
});
</script>
</body>
</html>
