<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>File upload with progress</title>
<style>
:root{
  --acc:#2563eb;--acc-dk:#2157cf;--acc-soft:rgba(37,99,235,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.drop{border:2px dashed var(--bd);border-radius:16px;padding:32px 20px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--acc-soft)}
.drop input{display:none}
.files{display:grid;gap:10px}
.file{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:11px 13px;border:1px solid var(--bd);border-radius:12px}
.file .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:6px}
.file .bar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.file .bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.file.done .bar i{background:var(--ok)}
.rm{border:0;background:none;cursor:pointer;color:var(--mut);display:inline-flex;padding:4px}
.rm:hover{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Upload files</h2><p class="sub">Up to 25 files, 100 MB each</p></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div class="drop"><input type="file" multiple aria-label="Choose files"><span style="display:inline-flex;color:var(--acc)"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 21V9M7 13l5-5 5 5M4 4h16"/></svg></span><div class="bold" style="margin-top:10px;font-size:15px">Drop files here</div><div class="sm mut" style="margin-top:3px">or click to choose from your device</div></div><div class="files"><div class="file done"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;border-radius:11px;background:rgba(8,145,178,0.13);color:#0891b2"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 3-2 4 3"/></svg></span><span><span class="meta"><b>hero-render.png</b><span class="pc">Done</span></span><span class="bar"><i style="width:100%"></i></span></span><button class="rm" type="button" aria-label="Remove hero-render.png"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="file" data-at="62"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;border-radius:11px;background:rgba(220,38,38,0.13);color:#dc2626"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M6 2h8l4 4v16H6Z"/><path d="M14 2v5h4"/></svg></span><span><span class="meta"><b>brand-guide-2026.pdf</b><span class="pc">62%</span></span><span class="bar"><i style="width:62%"></i></span></span><button class="rm" type="button" aria-label="Remove brand-guide-2026.pdf"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="file" data-at="18"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;border-radius:11px;background:rgba(124,58,237,0.13);color:#7c3aed"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M8 5.5v13l11-6.5Z"/></svg></span><span><span class="meta"><b>launch-clip.mp4</b><span class="pc">18%</span></span><span class="bar"><i style="width:18%"></i></span></span><button class="rm" type="button" aria-label="Remove launch-clip.mp4"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div></form><div class="ft"><span>3 files · 70.7 MB</span><span class="row" style="gap:8px"><button class="btn" type="button">Cancel all</button><button class="btn pri" type="submit">Finish upload</button></span></div></div></div>
<script>
const drop=document.querySelector('.drop');
const picker=drop.querySelector('input');
drop.addEventListener('click',()=>picker.click());
drop.addEventListener('dragover',event=>{event.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',event=>{event.preventDefault();drop.classList.remove('over');});
document.querySelectorAll('.rm').forEach(button=>{
  button.addEventListener('click',()=>button.closest('.file').remove());
});
document.querySelectorAll('.file:not(.done)').forEach(row=>{
  const fill=row.querySelector('.bar i');
  let percent=Number(row.dataset.at||0);
  const tick=setInterval(()=>{
    percent=Math.min(100,percent+Math.random()*9);
    fill.style.width=percent+'%';
    row.querySelector('.pc').textContent=Math.round(percent)+'%';
    if(percent>=100){clearInterval(tick);row.classList.add('done');row.querySelector('.pc').textContent='Done';}
  },600);
});
</script>
</body>
</html>
