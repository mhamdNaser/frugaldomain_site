<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fitness activity dashboard</title>
<style>
:root{
  --acc:#e11d48;--acc-dk:#e5385e;--acc-soft:rgba(225,29,72,0.22);
  --bg:#0b1120;--card:#121a2b;--soft:#182235;--bd:#243049;
  --ink:#e8edf7;--mut:#94a3b8;--faint:#64748b;
  --ok:#34d399;--ok-bg:rgba(52,211,153,.14);
  --warn:#fbbf24;--warn-bg:rgba(251,191,36,.14);
  --bad:#f87171;--bad-bg:rgba(248,113,113,.14);
  --r:14px;--sh:0 1px 2px rgba(0,0,0,.4),0 18px 40px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;padding:20px}
.rings h4{margin-top:10px}
.rings .v{font-size:12.5px;color:var(--mut);margin-top:3px}
</style>
</head>
<body>

ystem-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">92%</text></svg><h4>Stand</h4><div class="v">11 / 12 hours</div></div></div><div class="pad" style="border-top:1px solid var(--bd)"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3>This week</h3><span class="xs mut">Active calories</span></div><svg viewBox="0 0 480 180" width="100%" height="180" role="img" aria-label="Active calories per day this week" style="display:block;overflow:visible"><line x1="42" y1="154" x2="472" y2="154" stroke="var(--bd)" stroke-width="1"/><text x="34" y="157.5" text-anchor="end" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">0</text><line x1="42" y1="118" x2="472" y2="118" stroke="var(--bd)" stroke-width="1"/><text x="34" y="121.5" text-anchor="end" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">199</text><line x1="42" y1="82" x2="472" y2="82" stroke="var(--bd)" stroke-width="1"/><text x="34" y="85.5" text-anchor="end" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">398</text><line x1="42" y1="46" x2="472" y2="46" stroke="var(--bd)" stroke-width="1"/><text x="34" y="49.5" text-anchor="end" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">596</text><line x1="42" y1="10" x2="472" y2="10" stroke="var(--bd)" stroke-width="1"/><text x="34" y="13.5" text-anchor="end" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">795</text><text x="72.71" y="172" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">Mon</text><rect x="53.67" y="67.08" width="38.09" height="86.92" rx="4" fill="#e66767"><title>Calories · Mon: 480</title></rect><text x="134.14" y="172" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">Tue</text><rect x="115.1" y="41.73" width="38.09" height="112.27" rx="4" fill="#e66767"><title>Calories · Tue: 620</title></rect><text x="195.57" y="172" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">Wed</text><rect x="176.53" y="56.21" width="38.09" height="97.79" rx="4" fill="#e66767"><title>Calories · Wed: 540</title></rect><text x="257" y="172" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">Thu</text><rect x="237.96" y="25.43" width="38.09" height="128.57" rx="4" fill="#e66767"><title>Calories · Thu: 710</title></rect><text x="318.43" y="172" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">Fri</text><rect x="299.39" y="83.38" width="38.09" height="70.62" rx="4" fill="#e66767"><title>Calories · Fri: 390</title></rect><text x="379.86" y="172" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">Sat</text><rect x="360.81" y="34.48" width="38.09" height="119.52" rx="4" fill="#e66767"><title>Calories · Sat: 660</title></rect><text x="441.29" y="172" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif">Sun</text><rect x="422.24" y="41" width="38.09" height="113" rx="4" fill="#e66767"><title>Calories · Sun: 624</title></rect></svg></div><div class="ft"><span>12-day streak</span><span>Best this month: 810 kcal on the 6th</span></div></div></div>
</body>
