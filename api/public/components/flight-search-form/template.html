<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flight search form</title>
<style>
:root{
  --acc:#0ea5e9;--acc-dk:#0c91cd;--acc-soft:rgba(14,165,233,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:720px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.seg{display:inline-flex;padding:3px;background:var(--soft);border:1px solid var(--bd);border-radius:999px;margin-bottom:2px}
.seg button{border:0;background:none;padding:7px 15px;border-radius:999px;font:inherit;font-size:12.5px;font-weight:650;color:var(--mut);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:end}
.swap{width:40px;height:40px;border:1px solid var(--bd);border-radius:50%;background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--mut);margin-bottom:1px}
.swap:hover{border-color:var(--acc);color:var(--acc)}
@media (max-width:520px){.pair{grid-template-columns:1fr}.swap{margin:0 auto}}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Find a flight</h2><p class="sub">Direct and one-stop fares from 180 airlines</p></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><span class="seg"><button type="button" data-trip="return" aria-pressed="true">Return</button><button type="button" data-trip="one" aria-pressed="false">One way</button><button type="button" data-trip="multi" aria-pressed="false">Multi-city</button></span><div class="pair"><div><label class="lb" for="from">From</label><span style="position:relative;display:block"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg></span><input class="in" id="from" name="from" type="text" placeholder="City or airport" style="padding-left:38px" value="Riyadh (RUH)"></span></div><button class="swap" type="button" id="swap" aria-label="Swap airports"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button><div><label class="lb" for="to">To</label><span style="position:relative;display:block"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg></span><input class="in" id="to" name="to" type="text" placeholder="City or airport" style="padding-left:38px" value="Istanbul (IST)"></span></div></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"><div><label class="lb" for="out">Departing</label><input class="in" id="out" name="out" type="date" value="2026-10-02"></div><div><label class="lb" for="back">Returning</label><input class="in" id="back" name="back" type="date" value="2026-10-09"></div><div><label class="lb" for="cabin">Cabin</label><select class="in" id="cabin" name="cabin" ><option>Economy</option><option>Premium economy</option><option>Business</option><option>First</option></select></div></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="pax">Passengers</label><select class="in" id="pax" name="pax" ><option>1 adult</option><option>2 adults</option><option>2 adults, 1 child</option><option>2 adults, 2 children</option></select></div><div><label class="lb" for="flex">Flexibility</label><select class="in" id="flex" name="flex" ><option>Exact dates</option><option>± 1 day</option><option>± 3 days</option><option>Whole month</option></select></div></div><label for="direct" style="display:flex;align-items:flex-start;gap:9px;font-size:13px;cursor:pointer"><input type="checkbox" id="direct" name="direct" style="width:16px;height:16px;accent-color:var(--acc);margin-top:1px;flex:none"><span>Direct flights only</span></label><button class="btn pri" type="submit" style="width:100%;padding:11px"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>Search flights</button></form></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dir=q.get('dir');
  if(dir==='rtl'||dir==='ltr')document.documentElement.dir=dir;
  if(dir==='rtl')document.documentElement.lang='ar';
  var theme=q.get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
})();
</script>
<script>
document.getElementById('swap').addEventListener('click',()=>{
  const from=document.getElementById('from');
  const to=document.getElementById('to');
  [from.value,to.value]=[to.value,from.value];
});
document.querySelectorAll('.seg button').forEach(button=>{
  button.addEventListener('click',()=>{
    document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed','false'));
    button.setAttribute('aria-pressed','true');
    document.getElementById('back').disabled=button.dataset.trip==='one';
  });
});
</script>
</body>
</html>
