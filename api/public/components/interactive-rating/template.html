<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive rating</title>
<style>
:root{
  --acc:#f59e0b;--acc-dk:#d88b0a;--acc-soft:rgba(245,158,11,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.grp{padding:18px 20px;border-bottom:1px solid var(--bd)}
.grp:last-child{border-bottom:0}
.glabel{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700;margin-bottom:12px}
.gbody{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rate{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}
.rate input{position:absolute;opacity:0}
.rate label{cursor:pointer;color:var(--bd);transition:color .12s}
.rate label:hover,.rate label:hover ~ label,.rate input:checked ~ label{color:#f59e0b}
.rate.hearts label:hover,.rate.hearts label:hover ~ label,.rate.hearts input:checked ~ label{color:#e11d48}
.rate input:focus-visible+label{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.thumbs{display:flex;gap:9px}
.thumbs button{border:1px solid var(--bd);background:var(--card);border-radius:11px;padding:9px 15px;cursor:pointer;color:var(--mut);display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:600}
.thumbs button:hover{border-color:var(--acc);color:var(--acc)}
.thumbs button[aria-pressed=true]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Rating controls</h2><p class="sub">Tab into one and use the arrow keys</p></div></div><div class="grp"><span class="glabel">Stars</span><div class="gbody"><div class="rate"><input type="radio" name="st" id="st5" value="5"><label for="st5" aria-label="5 out of 5"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></label><input type="radio" name="st" id="st4" value="4"><label for="st4" aria-label="4 out of 5"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></label><input type="radio" name="st" id="st3" value="3"><label for="st3" aria-label="3 out of 5"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></label><input type="radio" name="st" id="st2" value="2"><label for="st2" aria-label="2 out of 5"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></label><input type="radio" name="st" id="st1" value="1"><label for="st1" aria-label="1 out of 5"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></label></div><span class="out sm bold" style="margin-left:12px"></span></div></div><div class="grp"><span class="glabel">Hearts</span><div class="gbody"><div class="rate hearts"><input type="radio" name="ht" id="ht5" value="5"><label for="ht5" aria-label="5 out of 5"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true" style="display:block"><path d="M12 20s-8-4.7-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.3-8 10-8 10Z"/></svg></label><input type="radio" name="ht" id="ht4" value="4"><label for="ht4" aria-label="4 out of 5"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true" style="display:block"><path d="M12 20s-8-4.7-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.3-8 10-8 10Z"/></svg></label><input type="radio" name="ht" id="ht3" value="3"><label for="ht3" aria-label="3 out of 5"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true" style="display:block"><path d="M12 20s-8-4.7-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.3-8 10-8 10Z"/></svg></label><input type="radio" name="ht" id="ht2" value="2"><label for="ht2" aria-label="2 out of 5"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true" style="display:block"><path d="M12 20s-8-4.7-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.3-8 10-8 10Z"/></svg></label><input type="radio" name="ht" id="ht1" value="1"><label for="ht1" aria-label="1 out of 5"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true" style="display:block"><path d="M12 20s-8-4.7-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.3-8 10-8 10Z"/></svg></label></div><span class="out sm bold" style="margin-left:12px"></span></div></div><div class="grp"><span class="glabel">Thumbs</span><div class="gbody"><div class="thumbs"><button type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg>Helpful</button><button type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M22 17 13.5 8.5 8.5 13.5 2 7"/><path d="M16 17h6v-6"/></svg>Not helpful</button></div></div></div><div class="grp"><span class="glabel">Read-only</span><div class="gbody"><span class="row" style="gap:10px"><span class="row" style="gap:2px;color:#f59e0b"><span style=""><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style=""><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style=""><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style=""><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span><span style="opacity:.28"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" style="display:block"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/></svg></span></span><span class="sm"><b>4.5</b> <span class="mut">from 1,284 reviews</span></span></span></div></div></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dir=q.get('dir');
  if(dir==='rtl'||dir==='ltr')document.documentElement.dir=dir;
  if(dir==='rtl')document.documentElement.lang='ar';
  var theme=q.get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
})();
</script>
<script>
document.querySelectorAll('.rate input').forEach(input=>{
  input.addEventListener('change',()=>{
    const out=input.closest('.grp').querySelector('.out');
    if(out)out.textContent=input.value+' of 5';
  });
});
document.querySelectorAll('.thumbs button').forEach(button=>{
  button.addEventListener('click',()=>{
    document.querySelectorAll('.thumbs button').forEach(b=>b.setAttribute('aria-pressed','false'));
    button.setAttribute('aria-pressed','true');
  });
});
</script>
</body>
</html>
