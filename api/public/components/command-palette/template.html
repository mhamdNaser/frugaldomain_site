<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command palette</title>
<style>
:root{
  --acc:#475569;--acc-dk:#3e4b5c;--acc-soft:rgba(71,85,105,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.palette{border-radius:16px;overflow:hidden}
.pinput{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--bd)}
.pinput input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:15px;color:var(--ink)}
.plist{max-height:320px;overflow:auto;padding:8px}
.psec{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700;padding:10px 10px 5px}
.pitem{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:start}
.pitem kbd{margin-inline-start:auto;font-size:11px;color:var(--mut);font-family:inherit;background:var(--soft);border:1px solid var(--bd);border-radius:5px;padding:1px 6px}
.pitem.on{background:var(--acc-soft);color:var(--acc)}
.pitem.on kbd{background:var(--card)}
.pfoot{display:flex;gap:16px;padding:11px 18px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--mut)}
.pfoot kbd{font-family:inherit;background:var(--soft);border:1px solid var(--bd);border-radius:4px;padding:0 5px}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="palette"><div class="pinput"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><input id="pq" type="text" placeholder="Type a command or search…" aria-label="Command palette"><kbd style="font-family:inherit;font-size:11px;color:var(--mut);background:var(--soft);border:1px solid var(--bd);border-radius:5px;padding:2px 6px">Esc</kbd></div><div class="plist"><div class="psec">Actions</div><button class="pitem" type="button" data-k="new component create"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 5v14M5 12h14"/></svg>New component<kbd>Ctrl N</kbd></button><button class="pitem" type="button" data-k="upload template file"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 21V9M7 13l5-5 5 5M4 4h16"/></svg>Upload a template file</button><button class="pitem" type="button" data-k="export json gallery"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg>Export the gallery as JSON</button><div class="psec">Go to</div><button class="pitem" type="button" data-k="components gallery"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Components<kbd>G then C</kbd></button><button class="pitem" type="button" data-k="drawing editor draw"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16Z"/></svg>Drawing editor<kbd>G then D</kbd></button><button class="pitem" type="button" data-k="users people team"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><path d="M17 5.2a3.5 3.5 0 0 1 0 6.6M18 20h4a5.4 5.4 0 0 0-3-4.9"/></svg>Users<kbd>G then U</kbd></button><button class="pitem" type="button" data-k="settings preferences"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>Settings<kbd>G then S</kbd></button><div class="psec">Recent</div><button class="pitem" type="button" data-k="analytics table sparklines"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M6 2h8l4 4v16H6Z"/><path d="M14 2v5h4"/></svg>Analytics table with sparklines</button><button class="pitem" type="button" data-k="checkout payment form"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M6 2h8l4 4v16H6Z"/><path d="M14 2v5h4"/></svg>Checkout payment form</button></div><div class="pfoot"><span><kbd>↑</kbd><kbd>↓</kbd> to move</span><span><kbd>↵</kbd> to run</span><span><kbd>Esc</kbd> to close</span></div></div></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dir=q.get('dir');
  if(dir==='rtl'||dir==='ltr')document.documentElement.dir=dir;
  if(dir==='rtl')document.documentElement.lang='ar';
  var theme=q.get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
})();
</script>
<script>
const input=document.getElementById('pq');
const items=()=>[...document.querySelectorAll('.pitem:not([hidden])')];
let index=0;
function paint(){
  items().forEach((item,i)=>item.classList.toggle('on',i===index));
  const active=items()[index];
  if(active)active.scrollIntoView({block:'nearest'});
}
input.addEventListener('input',()=>{
  const term=input.value.trim().toLowerCase();
  document.querySelectorAll('.pitem').forEach(item=>{
    item.hidden=term!==''&&!item.dataset.k.includes(term);
  });
  document.querySelectorAll('.psec').forEach(section=>{
    let next=section.nextElementSibling,any=false;
    while(next&&next.classList.contains('pitem')){if(!next.hidden)any=true;next=next.nextElementSibling;}
    section.hidden=!any;
  });
  index=0;paint();
});
input.addEventListener('keydown',event=>{
  const list=items();
  if(event.key==='ArrowDown'){event.preventDefault();index=(index+1)%list.length;paint();}
  if(event.key==='ArrowUp'){event.preventDefault();index=(index-1+list.length)%list.length;paint();}
  if(event.key==='Enter'&&list[index]){event.preventDefault();list[index].classList.add('on');}
});
input.focus();paint();
</script>
</body>
</html>
