<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video player card</title>
<style>
:root{
  --acc:#e11d48;--acc-dk:#c61a3f;--acc-soft:rgba(225,29,72,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:680px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.player{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(140deg,#1e293b,#0f172a)}
.poster{height:280px;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#e11d48,#7c3aed 60%,#0f172a)}
.playbtn{width:68px;height:68px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#0f172a;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.playbtn:hover{transform:scale(1.05)}
.ctrls{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;background:linear-gradient(transparent,rgba(15,23,42,.9));color:#fff}
.scrub{position:relative;height:5px;border-radius:999px;background:rgba(255,255,255,.26);cursor:pointer}
.scrub .buf{position:absolute;inset:0;width:68%;background:rgba(255,255,255,.34);border-radius:999px}
.scrub .played{position:absolute;inset:0;width:34%;background:var(--acc);border-radius:999px}
.scrub .knob{position:absolute;left:34%;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:#fff}
.crow{display:flex;align-items:center;gap:13px;margin-top:11px;font-size:12px;font-variant-numeric:tabular-nums}
.crow button{border:0;background:none;color:#fff;cursor:pointer;display:inline-flex;padding:2px}
.crow .right{margin-left:auto;display:flex;gap:13px;align-items:center}
</style>
</head>
<body>
<div class="wrap"><div class="card" style="padding:0;overflow:hidden"><div class="player"><div class="poster"><button class="playbtn" type="button" id="big" aria-label="Play the video"><svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5Z"/></svg></button></div><div class="ctrls"><div class="scrub" role="slider" aria-label="Seek" aria-valuenow="34" aria-valuemin="0" aria-valuemax="100" tabindex="0"><span class="buf"></span><span class="played"></span><span class="knob"></span></div><div class="crow"><button type="button" id="play" aria-label="Play"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5.5v13l11-6.5Z"/></svg></button><button type="button" aria-label="Mute"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></svg></button><span>4:52 / 14:22</span><span class="right"><button type="button" aria-label="Captions">CC</button><button type="button" aria-label="Settings"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></button><button type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button></span></div></div></div></div><div style="height:14px"></div><div class="card"><div class="pad"><h3>Drawing editor walkthrough</h3><p class="sub" style="margin-top:6px">184,210 views · published 12 September 2026</p></div></div></div>
<script>
const play=document.getElementById('play');
const big=document.getElementById('big');
let playing=false;
function toggle(){
  playing=!playing;
  const icon=playing?'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>'
    :'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5.5v13l11-6.5Z"/></svg>';
  play.innerHTML=icon;
  play.setAttribute('aria-label',playing?'Pause':'Play');
  big.style.display=playing?'none':'flex';
}
play.addEventListener('click',toggle);
big.addEventListener('click',toggle);
</script>
</body>
</html>
