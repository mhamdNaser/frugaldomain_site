<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-step wizard</title>
<style>
:root{
  --acc:#7c3aed;--acc-dk:#6d33d1;--acc-soft:rgba(124,58,237,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.steps{list-style:none;display:flex;gap:0;margin:0;padding:16px 20px;border-bottom:1px solid var(--bd);overflow-x:auto}
.steps li{display:flex;align-items:center;gap:9px;flex:1;min-width:0;color:var(--mut);font-size:12.5px;font-weight:600}
.steps li::after{content:'';flex:1;height:2px;background:var(--bd);margin:0 10px;min-width:16px}
.steps li:last-child::after{display:none}
.steps .dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--soft);border:1px solid var(--bd);font-size:12px;font-weight:700;flex:none}
.steps .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .now{color:var(--ink)}
.steps .now .dot{background:var(--acc);border-color:var(--acc);color:#fff}
.steps .done{color:var(--ink)}
.steps .done .dot{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.steps .done::after{background:var(--ok)}
.panel{display:none}
.panel.on{display:grid;gap:16px}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Set up your workspace</h2><p class="sub">This takes about two minutes</p></div></div><ol class="steps"><li class="now"><span class="dot">1</span><span class="lbl">Workspace</span></li><li class=""><span class="dot">2</span><span class="lbl">Team</span></li><li class=""><span class="dot">3</span><span class="lbl">Preferences</span></li></ol><form class="pad" onsubmit="return false" style="display:grid;gap:16px"><div class="panel on"><div><label class="lb" for="wsname">Workspace name</label><input class="in" id="wsname" name="wsname" type="text" placeholder="Acme Design" ></div><div><label class="lb" for="wsurl">Workspace URL</label><input class="in" id="wsurl" name="wsurl" type="text" placeholder="acme" aria-describedby="urlhint"><p class="hint">frugal.app/<b>acme</b></p></div><div><label class="lb" for="wssize">How big is your team?</label><select class="in" id="wssize" name="wssize" ><option>Just me</option><option>2 - 10 people</option><option>11 - 50 people</option><option>51 - 200 people</option><option>More than 200</option></select></div></div><div class="panel"><div><label class="lb" for="invite">Invite teammates by email</label><textarea class="in" id="invite" name="invite" rows="3" placeholder="lina@acme.com
omar@acme.com"></textarea><p class="hint">One address per line. You can do this later.</p></div><div><label class="lb" for="role">Default role for invitees</label><select class="in" id="role" name="role" ><option>Viewer</option><option>Editor</option><option>Admin</option></select></div></div><div class="panel"><div><label class="lb" for="theme">Interface theme</label><select class="in" id="theme" name="theme" ><option>Match my system</option><option>Always light</option><option>Always dark</option></select></div><div><label class="lb" for="lang">Language</label><select class="in" id="lang" name="lang" ><option>English</option><option>العربية</option><option>Français</option><option>Türkçe</option></select></div><label for="digest" style="display:flex;align-items:flex-start;gap:9px;font-size:13px;cursor:pointer"><input type="checkbox" id="digest" name="digest" checked style="width:16px;height:16px;accent-color:var(--acc);margin-top:1px;flex:none"><span>Send me a weekly summary of workspace activity</span></label></div></form><div class="ft"><button class="btn" type="button" id="back">Back</button><button class="btn pri" type="button" id="next">Continue</button></div></div></div>
<script>
let index=0;
const panels=[...document.querySelectorAll('.panel')];
const items=[...document.querySelectorAll('.steps li')];
const back=document.getElementById('back');
const next=document.getElementById('next');
function render(){
  panels.forEach((panel,i)=>panel.classList.toggle('on',i===index));
  items.forEach((item,i)=>{
    item.className=i<index?'done':i===index?'now':'';
    item.querySelector('.dot').textContent=i<index?'\u2713':String(i+1);
  });
  back.disabled=index===0;
  next.textContent=index===panels.length-1?'Finish':'Continue';
}
back.addEventListener('click',()=>{if(index>0){index--;render();}});
next.addEventListener('click',()=>{if(index<panels.length-1){index++;render();}});
render();
</script>
</body>
</html>
