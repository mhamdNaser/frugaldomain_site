<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabs</title>
<style>
:root{
  --acc:#2563eb;--acc-dk:#2157cf;--acc-soft:rgba(37,99,235,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:680px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
[role=tablist]{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--bd);overflow-x:auto}
[role=tab]{border:0;background:none;padding:14px 14px 12px;font:inherit;font-size:13.5px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
[role=tab]:hover{color:var(--ink)}
[role=tab][aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc)}
[role=tab] .n{background:var(--soft);color:var(--mut);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700}
[role=tab][aria-selected=true] .n{background:var(--acc-soft);color:var(--acc)}
[role=tabpanel]{padding:20px}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Project</h2><p class="sub">Aurora Redesign</p></div></div><div role="tablist" aria-label="Project sections"><button role="tab" id="t-over" aria-controls="p-over" aria-selected="true" tabindex="0">Overview</button><button role="tab" id="t-tasks" aria-controls="p-tasks" aria-selected="false" tabindex="-1">Tasks<span class="n">12</span></button><button role="tab" id="t-files" aria-controls="p-files" aria-selected="false" tabindex="-1">Files<span class="n">48</span></button><button role="tab" id="t-team" aria-controls="p-team" aria-selected="false" tabindex="-1">Team</button></div><div role="tabpanel" id="p-over" aria-labelledby="t-over"><h3>Overview</h3><p class="sub" style="margin-top:6px">A full rebuild of the marketing site and the component gallery, running to the end of November. Arrow keys move between these tabs.</p></div><div role="tabpanel" id="p-tasks" aria-labelledby="t-tasks" hidden><h3>Tasks</h3><p class="sub" style="margin-top:6px">12 open, 8 of them due this week.</p></div><div role="tabpanel" id="p-files" aria-labelledby="t-files" hidden><h3>Files</h3><p class="sub" style="margin-top:6px">48 files, 182 MB, last uploaded two hours ago.</p></div><div role="tabpanel" id="p-team" aria-labelledby="t-team" hidden><h3>Team</h3><div style="margin-top:10px"><span style="display:inline-flex;align-items:center"><span style="margin-left:0;border-radius:50%;box-shadow:0 0 0 2px var(--card)"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:50%;background:rgba(5,150,105,0.16);color:#059669;font-size:13.6px;font-weight:700;letter-spacing:.02em">LH</span></span><span style="margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--card)"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:50%;background:rgba(37,99,235,0.16);color:#2563eb;font-size:13.6px;font-weight:700;letter-spacing:.02em">OS</span></span><span style="margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--card)"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:50%;background:rgba(5,150,105,0.16);color:#059669;font-size:13.6px;font-weight:700;letter-spacing:.02em">MR</span></span><span style="margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--card)"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:50%;background:rgba(217,119,6,0.16);color:#d97706;font-size:13.6px;font-weight:700;letter-spacing:.02em">SA</span></span></span></div></div></div></div>
<script>
const tabs=[...document.querySelectorAll('[role=tab]')];
function select(tab){
  tabs.forEach(item=>{
    const on=item===tab;
    item.setAttribute('aria-selected',String(on));
    item.tabIndex=on?0:-1;
    document.getElementById(item.getAttribute('aria-controls')).hidden=!on;
  });
  tab.focus();
}
tabs.forEach((tab,index)=>{
  tab.addEventListener('click',()=>select(tab));
  tab.addEventListener('keydown',event=>{
    if(event.key==='ArrowRight')select(tabs[(index+1)%tabs.length]);
    if(event.key==='ArrowLeft')select(tabs[(index-1+tabs.length)%tabs.length]);
    if(event.key==='Home')select(tabs[0]);
    if(event.key==='End')select(tabs[tabs.length-1]);
  });
});
</script>
</body>
</html>
