<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurant reservation form</title>
<style>
:root{
  --acc:#c2410c;--acc-dk:#ab390b;--acc-soft:rgba(194,65,12,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:520px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.sizes{display:flex;gap:7px;flex-wrap:wrap}
.sizes button{width:44px;height:44px;border:1px solid var(--bd);border-radius:12px;background:var(--card);font:inherit;font-weight:700;cursor:pointer;transition:.15s}
.sizes button:hover{border-color:var(--acc);color:var(--acc)}
.sizes button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.slots{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
.slot{padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--card);font:inherit;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.slot:hover:not([disabled]){border-color:var(--acc);color:var(--acc)}
.slot[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.slot[disabled]{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Book a table</h2><p class="sub">Marjan Kitchen · dinner service from 18:00</p></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div><span class="lb">How many of you?</span><div class="sizes"><button type="button" aria-pressed="false" aria-label="1 guests">1</button><button type="button" aria-pressed="true" aria-label="2 guests">2</button><button type="button" aria-pressed="false" aria-label="3 guests">3</button><button type="button" aria-pressed="false" aria-label="4 guests">4</button><button type="button" aria-pressed="false" aria-label="5 guests">5</button><button type="button" aria-pressed="false" aria-label="6 guests">6</button><button type="button" aria-pressed="false" style="width:auto;padding:0 14px">7+</button></div></div><div><label class="lb" for="rdate">Date</label><input class="in" id="rdate" name="rdate" type="date" value="2026-09-24"></div><div><span class="lb">Time</span><div class="slots"><button class="slot" type="button" aria-pressed="false">18:00</button><button class="slot" type="button" aria-pressed="false">18:30</button><button class="slot" type="button" disabled>19:00</button><button class="slot" type="button" disabled>19:30</button><button class="slot" type="button" aria-pressed="true">20:00</button><button class="slot" type="button" aria-pressed="false">20:30</button><button class="slot" type="button" aria-pressed="false">21:00</button><button class="slot" type="button" aria-pressed="false">21:30</button></div></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="rname">Name</label><input class="in" id="rname" name="rname" type="text" placeholder="Rana Khalil" autocomplete="name"></div><div><label class="lb" for="rphone">Phone</label><input class="in" id="rphone" name="rphone" type="tel" placeholder="+966 5x xxx xxxx" autocomplete="tel"></div></div><div><label class="lb" for="roccasion">Occasion <span class="mut" style="font-weight:500">(optional)</span></label><select class="in" id="roccasion" name="roccasion" ><option>No occasion</option><option>Birthday</option><option>Anniversary</option><option>Business dinner</option><option>Celebration</option></select></div></form><div class="ft"><span>Held for 15 minutes after the booking time</span><span class="row" style="gap:8px"><button class="btn" type="button">Cancel</button><button class="btn pri" type="submit">Confirm table</button></span></div></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dir=q.get('dir');
  if(dir==='rtl'||dir==='ltr')document.documentElement.dir=dir;
  if(dir==='rtl')document.documentElement.lang='ar';
  var theme=q.get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
})();
</script>
<script>
function group(selector){
  document.querySelectorAll(selector).forEach(button=>{
    button.addEventListener('click',()=>{
      document.querySelectorAll(selector).forEach(b=>b.setAttribute('aria-pressed','false'));
      button.setAttribute('aria-pressed','true');
    });
  });
}
group('.sizes button');
group('.slot:not([disabled])');
</script>
</body>
</html>
