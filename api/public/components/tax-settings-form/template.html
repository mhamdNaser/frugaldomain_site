<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tax settings form</title>
<style>
:root{
  --acc:#475569;--acc-dk:#3e4b5c;--acc-soft:rgba(71,85,105,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:620px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.pick{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--bd);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--acc)}
.pick input{width:18px;height:18px;accent-color:var(--acc);flex:none}
.pick .body{flex:1}
.pick .t{display:block;font-weight:650;font-size:13.5px}
.pick .d{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.pick .m{font-weight:700;font-size:14px;white-space:nowrap}
.pick:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}.tgl{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--bd)}
.tgl:last-child{border-bottom:0}
.tgl label{font-weight:600;font-size:13.5px;cursor:pointer}
.sw{position:relative;display:inline-block;width:40px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--bd);transition:.2s;cursor:pointer}
.sw i::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::before{transform:translateX(18px)}
.rate{display:grid;grid-template-columns:1.4fr .8fr auto;gap:9px;align-items:center}
.rate .in{padding:8px 10px;font-size:13px}
.rm{border:1px solid var(--bd);border-radius:9px;background:var(--card);padding:8px;cursor:pointer;color:var(--mut);display:inline-flex}
.rm:hover{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Tax</h2><p class="sub">Applies to every new order from the moment you save</p></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div><label class="lb" for="taxid">Tax registration number</label><input class="in" id="taxid" name="taxid" type="text" placeholder="300123456700003" ><p class="hint">Printed on every invoice and receipt.</p></div><div><span class="lb">How should prices be shown?</span><div style="display:grid;gap:10px;margin-top:2px"><label class="pick" for="incl"><input type="radio" name="disp" id="incl" checked><span class="body"><span class="t">Prices include tax</span><span class="d">A $100 product is charged at $100 and the tax is shown as a breakdown</span></span></label><label class="pick" for="excl"><input type="radio" name="disp" id="excl"><span class="body"><span class="t">Prices exclude tax</span><span class="d">A $100 product is charged at $115 with 15% added at checkout</span></span></label></div></div><div><span class="lb">Rates by region</span><div style="display:grid;gap:9px"><div class="rate"><input class="in" value="Saudi Arabia" aria-label="Region"><input class="in" value="15%" aria-label="Rate"><button class="rm" type="button" aria-label="Remove rate"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div><div class="rate"><input class="in" value="United Arab Emirates" aria-label="Region"><input class="in" value="5%" aria-label="Rate"><button class="rm" type="button" aria-label="Remove rate"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div><div class="rate"><input class="in" value="Rest of world" aria-label="Region"><input class="in" value="0%" aria-label="Rate"><button class="rm" type="button" aria-label="Remove rate"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div></div><button class="btn tiny" type="button" style="margin-top:9px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 5v14M5 12h14"/></svg>Add a region</button></div><div class="tgl"><span><label for="digital">Charge tax on digital goods</label><span class="xs mut" style="display:block;margin-top:2px">Applies the buyer country rate to downloads</span></span><span class="sw"><input type="checkbox" id="digital" checked><i></i></span></div><div class="tgl"><span><label for="shiptax">Charge tax on shipping</label><span class="xs mut" style="display:block;margin-top:2px">Some jurisdictions require this</span></span><span class="sw"><input type="checkbox" id="shiptax"><i></i></span></div></form><div class="ft"><span>Existing orders are never changed</span><span class="row" style="gap:8px"><button class="btn" type="button">Discard</button><button class="btn pri" type="submit">Save tax settings</button></span></div></div></div>
</body>
</html>
