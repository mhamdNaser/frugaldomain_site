<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prescription form</title>
<style>
:root{
  --acc:#4f46e5;--acc-dk:#463eca;--acc-soft:rgba(79,70,229,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:620px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.sig{padding:13px 15px;border-radius:12px;background:var(--acc-soft);color:var(--acc);font-size:13.5px;font-weight:600}
.pt{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--bd);background:var(--soft)}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>New prescription</h2><p class="sub">Dr. Haddad · clinic licence 44-2019</p></div></div><div class="pt"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;flex:none;width:38px;height:38px;border-radius:50%;background:rgba(219,39,119,0.16);color:#db2777;font-size:15.2px;font-weight:700;letter-spacing:.02em">RK</span><span><b style="display:block">Rana Khalil</b><span class="xs mut">34 years · MRN 884-2019 · allergic to penicillin</span></span></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="drug">Medicine</label><input class="in" id="drug" name="drug" type="text" placeholder="Amoxicillin" ></div><div><label class="lb" for="dose">Dose</label><input class="in" id="dose" name="dose" type="text" placeholder="500 mg" ></div></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="freq">Frequency</label><select class="in" id="freq" name="freq" ><option>Once daily</option><option>Twice daily</option><option>Three times daily</option><option>Every 8 hours</option><option>As needed</option></select></div><div><label class="lb" for="dur">Duration</label><select class="in" id="dur" name="dur" ><option>3 days</option><option>5 days</option><option>7 days</option><option>14 days</option><option>1 month</option><option>Ongoing</option></select></div></div><div class="sig" id="sig"></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="route">Route</label><select class="in" id="route" name="route" ><option>By mouth</option><option>Topical</option><option>Inhaled</option><option>Injection</option></select></div><div><label class="lb" for="refills">Refills</label><select class="in" id="refills" name="refills" ><option>None</option><option>1</option><option>2</option><option>3</option><option>5</option></select></div></div><div><label class="lb" for="pnotes">Notes for the pharmacist <span class="mut" style="font-weight:500">(optional)</span></label><textarea class="in" id="pnotes" name="pnotes" rows="2" placeholder="Counselling points, interactions to check."></textarea></div><label for="generic" style="display:flex;align-items:flex-start;gap:9px;font-size:13px;cursor:pointer"><input type="checkbox" id="generic" name="generic" checked style="width:16px;height:16px;accent-color:var(--acc);margin-top:1px;flex:none"><span>Generic substitution permitted</span></label></form><div class="ft"><span></span><span class="row" style="gap:8px"><button class="btn" type="button">Save draft</button><button class="btn pri" type="submit">Sign and send to pharmacy</button></span></div></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dir=q.get('dir');
  if(dir==='rtl'||dir==='ltr')document.documentElement.dir=dir;
  if(dir==='rtl')document.documentElement.lang='ar';
  var theme=q.get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
})();
</script>
<script>
const parts=['drug','dose','freq','dur'];
function build(){
  const drug=document.getElementById('drug').value||'[medicine]';
  const dose=document.getElementById('dose').value||'[dose]';
  const freq=document.getElementById('freq').value;
  const dur=document.getElementById('dur').value;
  document.getElementById('sig').textContent='Take '+dose+' of '+drug+' '+freq.toLowerCase()+' for '+dur.toLowerCase()+'.';
}
parts.forEach(id=>{
  const field=document.getElementById(id);
  field.addEventListener('input',build);
  field.addEventListener('change',build);
});
build();
</script>
</body>
</html>
