<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webhook endpoint form</title>
<style>
:root{
  --acc:#0f766e;--acc-dk:#0d6861;--acc-soft:rgba(15,118,110,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:620px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.events{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grp h4{margin-bottom:8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-size:10.5px}
.grp label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;cursor:pointer}
.grp input{width:15px;height:15px;accent-color:var(--acc)}
.secret{display:flex;gap:8px}
.secret code{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Add an endpoint</h2><p class="sub">Events are retried for 24 hours with backoff</p></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div><label class="lb" for="url">Endpoint URL</label><div class="row" style="gap:8px"><span style="position:relative;display:block"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M10 13a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 4.3l-1.7 1.7"/><path d="M14 11a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 19.7l1.7-1.7"/></svg></span><input class="in" id="url" name="url" type="url" placeholder="https://api.yoursite.com/webhooks/frugal" style="padding-left:38px" ></span><button class="btn" type="button" id="test">Send test</button></div><p class="hint" id="testout" hidden style="color:var(--ok)">Test event delivered · 200 OK in 142 ms</p></div><div><label class="lb" for="desc">Description</label><input class="in" id="desc" name="desc" type="text" placeholder="What this endpoint is for" ></div><div><span class="lb">Events to send</span><div class="events"><div class="grp"><h4>Components</h4><label><input type="checkbox" checked>component.published</label><label><input type="checkbox" checked>component.updated</label><label><input type="checkbox">component.deleted</label><label><input type="checkbox" checked>component.downloaded</label></div><div class="grp"><h4>Drawings</h4><label><input type="checkbox">drawing.created</label><label><input type="checkbox" checked>drawing.approved</label><label><input type="checkbox">drawing.rejected</label></div><div class="grp"><h4>Billing</h4><label><input type="checkbox" checked>invoice.paid</label><label><input type="checkbox" checked>invoice.failed</label><label><input type="checkbox">subscription.cancelled</label></div></div></div><div><span class="lb">Signing secret</span><div class="secret"><code id="secret" data-masked="1" data-mask="whsec_••••••••••••••••2f81" data-full="whsec_9f2ac41b77de0c40f82f81">whsec_••••••••••••••••2f81</code><button class="btn" type="button" id="reveal">Reveal</button></div><p class="hint">Verify the <code>X-Frugal-Signature</code> header against this secret on every request.</p></div></form><div class="ft"><span></span><span class="row" style="gap:8px"><button class="btn" type="button">Cancel</button><button class="btn pri" type="submit">Create endpoint</button></span></div></div></div>
<script>
const secret=document.getElementById('secret');
document.getElementById('reveal').addEventListener('click',()=>{
  const masked=secret.dataset.masked==='1';
  secret.textContent=masked?secret.dataset.full:secret.dataset.mask;
  secret.dataset.masked=masked?'0':'1';
  document.getElementById('reveal').textContent=masked?'Hide':'Reveal';
});
document.getElementById('test').addEventListener('click',()=>{
  const out=document.getElementById('testout');
  out.hidden=false;
});
</script>
</body>
</html>
