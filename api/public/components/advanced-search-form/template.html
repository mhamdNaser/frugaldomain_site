<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advanced search form</title>
<style>
:root{
  --acc:#4f46e5;--acc-dk:#463eca;--acc-soft:rgba(79,70,229,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:680px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:right}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.cond{display:grid;grid-template-columns:1.1fr 1fr 1.4fr auto;gap:9px;align-items:center}
.cond .in{padding:8px 10px;font-size:13px}
.rm{border:1px solid var(--bd);border-radius:9px;background:var(--card);padding:8px;cursor:pointer;color:var(--mut);display:inline-flex}
.rm:hover{border-color:var(--bad);color:var(--bad)}
.join{display:inline-flex;padding:3px;background:var(--soft);border:1px solid var(--bd);border-radius:999px}
.join button{border:0;background:none;padding:5px 13px;border-radius:999px;font:inherit;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer}
.join button[aria-pressed=true]{background:var(--acc);color:#fff}
.preview{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;color:var(--mut);word-break:break-word}
@media (max-width:560px){.cond{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Advanced search</h2><p class="sub">Build a query, save it, reuse it</p></div><div class="row" style="gap:8px;flex-wrap:wrap"><span class="join"><button type="button" aria-pressed="true">AND</button><button type="button" aria-pressed="false">OR</button></span></div></div><form class="pad" style="display:grid;gap:16px" onsubmit="return false"><div id="conds" style="display:grid;gap:9px"><div class="cond"><select class="in" aria-label="Field"><option>name</option><option>category</option><option>tag</option><option>downloads</option><option>updated</option></select><select class="in" aria-label="Operator"><option>contains</option><option>is</option><option>is not</option><option>starts with</option><option>is greater than</option></select><input class="in" placeholder="Value" aria-label="Value" value="table"><button class="rm" type="button" aria-label="Remove condition"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div><div class="cond"><select class="in" aria-label="Field"><option>category</option><option>name</option><option>tag</option><option>downloads</option><option>updated</option></select><select class="in" aria-label="Operator"><option>is</option><option>contains</option><option>is not</option></select><input class="in" placeholder="Value" aria-label="Value" value="dashboards"><button class="rm" type="button" aria-label="Remove condition"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button></div></div><button class="btn tiny" type="button" id="addcond" style="justify-self:start"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><path d="M12 5v14M5 12h14"/></svg>Add condition</button><div><span class="lb">Query</span><div class="preview" id="q"></div></div><div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div><label class="lb" for="sortby">Sort by</label><select class="in" id="sortby" name="sortby" ><option>Most relevant</option><option>Newest first</option><option>Most downloaded</option><option>Alphabetical</option></select></div><div><label class="lb" for="savename">Save this search as</label><input class="in" id="savename" name="savename" type="text" placeholder="Optional name" ></div></div></form><div class="ft"><span>412 components indexed</span><span class="row" style="gap:8px"><button class="btn" type="button">Reset</button><button class="btn pri" type="submit">Search</button></span></div></div></div>
<script>
const rows=document.getElementById('conds');
let join='AND';
function preview(){
  const parts=[...rows.querySelectorAll('.cond')].map(row=>{
    const selects=row.querySelectorAll('select');
    const value=row.querySelector('input').value||'...';
    return selects[0].value+' '+selects[1].value+' "'+value+'"';
  });
  document.getElementById('q').textContent=parts.join(' '+join+' ');
}
rows.addEventListener('input',preview);
rows.addEventListener('change',preview);
rows.addEventListener('click',event=>{
  const button=event.target.closest('.rm');
  if(button&&rows.children.length>1){button.closest('.cond').remove();preview();}
});
document.getElementById('addcond').addEventListener('click',()=>{
  const row=rows.firstElementChild.cloneNode(true);
  row.querySelector('input').value='';
  rows.appendChild(row);
  preview();
});
document.querySelectorAll('.join button').forEach(button=>{
  button.addEventListener('click',()=>{
    document.querySelectorAll('.join button').forEach(b=>b.setAttribute('aria-pressed','false'));
    button.setAttribute('aria-pressed','true');
    join=button.textContent.trim();
    preview();
  });
});
preview();
</script>
</body>
</html>
