<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Users table</title>
<style>
  :root{--bd:#e2e8f0;--mut:#64748b;--ink:#0f172a;--acc:#2563eb}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#f8fafc}
  .card{max-width:900px;margin:0 auto;background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden}
  .head{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
  .head h2{margin:0;font-size:15px}
  input{flex:1;min-width:160px;padding:8px 11px;border:1px solid var(--bd);border-radius:8px;font:inherit}
  table{width:100%;border-collapse:collapse}
  th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--bd)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);cursor:pointer;user-select:none;background:#f8fafc}
  tbody tr:hover{background:#f8fafc}
  .pill{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .on{background:#dcfce7;color:#15803d}.off{background:#fee2e2;color:#b91c1c}
  .foot{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;color:var(--mut);font-size:12px}
  button{padding:6px 12px;border:1px solid var(--bd);background:#fff;border-radius:8px;cursor:pointer;font:inherit}
  button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div class="card">
  <div class="head"><h2>Users</h2><input id="q" placeholder="Search…" aria-label="Search"></div>
  <table>
    <thead><tr><th data-k="name">Name</th><th data-k="email">Email</th><th data-k="role">Role</th><th data-k="status">Status</th></tr></thead>
    <tbody id="b"></tbody>
  </table>
  <div class="foot"><span id="info"></span><span><button id="p">Prev</button> <button id="n">Next</button></span></div>
</div>
<script>
const rows=[["Sarah Hassan","sarah@example.com","Admin",1],["Omar Khatib","omar@example.com","Editor",1],
["Layla Karam","layla@example.com","Viewer",0],["Youssef Najjar","youssef@example.com","Editor",1],
["Huda Suleiman","huda@example.com","Admin",1],["Khaled Ahmad","khaled@example.com","Viewer",0],
["Reem Qassem","reem@example.com","Editor",1],["Bilal Hassoun","bilal@example.com","Viewer",1]]
.map(([name,email,role,active])=>({name,email,role,status:active?"Active":"Inactive"}));
let page=1,per=5,key="name",dir=1,q="";
const b=document.getElementById("b"),info=document.getElementById("info");
function view(){const f=rows.filter(r=>!q||Object.values(r).some(v=>String(v).toLowerCase().includes(q)));
f.sort((x,y)=>String(x[key]).localeCompare(String(y[key]))*dir);return f;}
function draw(){const f=view(),pages=Math.max(1,Math.ceil(f.length/per));page=Math.min(page,pages);
const s=(page-1)*per,slice=f.slice(s,s+per);
b.innerHTML=slice.map(r=>`<tr><td>${r.name}</td><td>${r.email}</td><td>${r.role}</td>
<td><span class="pill ${r.status==="Active"?"on":"off"}">${r.status}</span></td></tr>`).join("")
||`<tr><td colspan="4" style="text-align:center;color:var(--mut);padding:26px">No results</td></tr>`;
info.textContent=`${f.length?s+1:0}–${s+slice.length} of ${f.length}`;
document.getElementById("p").disabled=page<=1;document.getElementById("n").disabled=page>=pages;}
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;dir=key===k?-dir:1;key=k;draw();});
document.getElementById("q").oninput=e=>{q=e.target.value.toLowerCase();page=1;draw();};
document.getElementById("p").onclick=()=>{page--;draw();};
document.getElementById("n").onclick=()=>{page++;draw();};
draw();
</script>
</body>
</html>
