<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search with suggestions</title>
<style>
:root{
  --acc:#0891b2;--acc-dk:#07809d;--acc-soft:rgba(8,145,178,0.1);
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--bd:#e5e8ef;
  --ink:#101828;--mut:#667085;--faint:#98a2b3;
  --ok:#047857;--ok-bg:#ecfdf5;
  --warn:#b45309;--warn-bg:#fffbeb;
  --bad:#be123c;--bad-bg:#fff1f2;
  --r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 12px 32px -16px rgba(16,24,40,.22);
}
:root{--dir:1}
[dir="rtl"]{--dir:-1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 18px;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','Noto Sans Arabic','Segoe UI Historic','Geeza Pro','Dubai',Tahoma,sans-serif;display:flex;justify-content:center;align-items:flex-start;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:560px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-top:1px solid var(--bd);font-size:12.5px;color:var(--mut);flex-wrap:wrap}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.011em}
h1{font-size:20px;font-weight:680}
h2{font-size:16px;font-weight:660}
h3{font-size:14px;font-weight:650}
h4{font-size:12.5px;font-weight:650}
p{margin:0}
.sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.bold{font-weight:650}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dk);border-color:var(--acc-dk);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--mut)}
.btn.gh:hover{background:var(--soft);color:var(--ink)}
.btn.tiny{padding:6px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.neutral{background:var(--soft);color:var(--mut)}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:88px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir="rtl"] select.in{background-position:17px 50%,12px 50%}
.lb{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.hint{font-size:11.5px;color:var(--mut);margin-top:5px}
.err{font-size:11.5px;color:var(--bad);margin-top:5px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:start;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .14s}
.right{text-align:end}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.sbox{position:relative}
.sfield{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:12px;padding:11px 14px;background:var(--card)}
.sfield:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.sfield input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:14px;color:var(--ink)}
.sugg{position:absolute;inset-inline-start:0;inset-inline-end:0;top:calc(100% + 7px);background:var(--card);border:1px solid var(--bd);border-radius:13px;box-shadow:var(--sh);padding:7px;z-index:20;max-height:260px;overflow:auto}
.sugg .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700;padding:9px 10px 5px}
.sugg button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:start}
.sugg button:hover{background:var(--soft)}
.sugg mark{background:var(--acc-soft);color:var(--acc);font-weight:700;border-radius:3px;padding:0 1px}
.sugg .cat{margin-inline-start:auto;font-size:11px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hd"><div><h2>Search</h2><p class="sub">Type "table" or "form" to see the highlighting</p></div></div><div class="pad"><div class="sbox"><div class="sfield"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><input id="sq" type="search" placeholder="Search components…" role="combobox" aria-expanded="true" aria-controls="sugg" autocomplete="off"></div><div class="sugg" id="sugg" role="listbox"><div class="lbl">Recent searches</div><button type="button" role="option"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>pricing table<span class="cat">3 results</span></button><button type="button" role="option"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>dark dashboard<span class="cat">8 results</span></button><button type="button" role="option"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>checkout<span class="cat">4 results</span></button></div></div><div id="recent" hidden><div class="lbl">Recent searches</div><button type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>pricing table<span class="cat">3 results</span></button><button type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>dark dashboard<span class="cat">8 results</span></button><button type="button"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>checkout<span class="cat">4 results</span></button></div><div style="height:210px"></div></div></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dir=q.get('dir');
  if(dir==='rtl'||dir==='ltr')document.documentElement.dir=dir;
  if(dir==='rtl')document.documentElement.lang='ar';
  var theme=q.get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
})();
</script>
<script>
const field=document.getElementById('sq');
const box=document.getElementById('sugg');
const data=[
  ['Users directory table','Tables'],['Sortable data table','Tables'],['Invoice line items','Tables'],
  ['Sign in form','Forms'],['Checkout payment form','Forms'],['Multi-step wizard','Forms'],
  ['Revenue overview dashboard','Dashboards'],['KPI stat tiles','Dashboards'],
  ['Button set','UI Elements'],['Modal dialog','UI Elements'],['Toast notifications','UI Elements']
];
function render(term){
  const matches=data.filter(row=>row[0].toLowerCase().includes(term)).slice(0,6);
  if(!matches.length){box.innerHTML='<div class="lbl">No matches</div>';return;}
  box.innerHTML='<div class="lbl">Components</div>'+matches.map(([name,category])=>{
    const at=name.toLowerCase().indexOf(term);
    const marked=term?name.slice(0,at)+'<mark>'+name.slice(at,at+term.length)+'</mark>'+name.slice(at+term.length):name;
    return '<button type="button" role="option">'+marked+'<span class="cat">'+category+'</span></button>';
  }).join('');
}
field.addEventListener('input',()=>{
  const term=field.value.trim().toLowerCase();
  box.hidden=false;
  if(!term){box.innerHTML=document.getElementById('recent').innerHTML;return;}
  render(term);
});
field.addEventListener('focus',()=>{box.hidden=false;});
document.addEventListener('click',event=>{if(!event.target.closest('.sbox'))box.hidden=true;});
</script>
</body>
</html>
