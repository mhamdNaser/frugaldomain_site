<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!--
      The .ico is what a search engine fetches by convention, whatever is
      declared here, so it has to be the real mark; the 48px png is the size
      Google asks for when a page declares one.
    -->
    <!-- Theme first: the saved mode and the admin theme must be in place before anything paints. -->
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; }
      catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/appearance.css" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png?v=3" />
    <link rel="apple-touch-icon" href="/images/favicon-light.png?v=3" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js) — G-QBC3F84LPM
         Loaded after the load event rather than inline: analytics is never
         worth a slower first paint. The dataLayer and gtag() are defined here
         and now, so the config and any page view that happens before the
         script finishes downloading are queued rather than lost.

         `send_page_view: false` because this is a single-page app. Left on,
         gtag counts the first page only - no matter how many routes a visitor
         then walks - and counts it before React has set the document title,
         so that one view is filed under the prerendered home-page title.
         Every view, the first included, is sent by usePageTracking instead.

         Nothing is requested unless the page is really being served from the
         live host, so the prerender build (which walks every route in a
         headless browser against a local server) and a dev session do not
         report themselves as visitors.

         This replaced tag manager container GTM-539JM4JX. The container was
         published empty - its tag list is literally "tags":[] - so it fired
         nothing while costing 335 KB a page load; a comment here claimed it
         was firing this very tag, and the property had in fact never received
         a single hit. If the container is ever given tags, put its snippet
         back, but configure GA4 in one place only: two copies of one
         measurement ID count every visit twice. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-QBC3F84LPM', { send_page_view: false });

      if (window.location.hostname === 'frugaldomain.site') {
        var started = false;
        var start = function () {
          if (started) return;
          started = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-QBC3F84LPM';
          document.head.appendChild(s);
        };

        if (document.readyState === 'complete') start();
        else window.addEventListener('load', start);

        // Waiting only for load loses the visitors it would be most useful to
        // know about. Much of this site's audience is on a slow connection,
        // where load can be ten seconds away and people leave before it; their
        // queued view would then never be sent, and the figures would quietly
        // describe fast connections only. So load still wins the race when it
        // is quick, and this is the ceiling when it is not.
        setTimeout(start, 4000);
      }
    </script>
    <!-- End Google tag -->

    <!-- ===== Basic SEO Meta Tags =====
         Only tags that are identical on every page belong here.
         Title, description, canonical, robots, Open Graph and JSON-LD are all
         owned by <SiteSeo> (react-helmet-async) and baked per route by the
         prerenderer. Repeating any of those here would emit two copies into
         the prerendered HTML, and a crawler reads the first one it meets —
         which would serve this page's values on every route. -->
    <title>FrugalDomain — Icon Library, File Converters & Store Operations</title>
    <meta name="theme-color" content="#0B1220" />
    <meta name="author" content="FrugalDomain" />

    <!-- The analytics origins are contacted on every page load; resolving them
         early keeps them off the critical path. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <!-- The AdSense tag is added to every snapshot by postProcess in vite.config.js:
         loaded here it runs inside the prerender browser and the render fails. -->
    <script type="module" crossorigin src="/assets/index-Dau5i4LX.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CgbtbQqU.css">
  </head>


  <body>

    <div id="root"></div>
  </body>

</html>
