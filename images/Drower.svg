<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="Vector drawing board">
  <title>Drawing board</title>
  <defs>
    <linearGradient id="dw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="dw-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="760" height="560" rx="28" fill="url(#dw-bg)"/>
  <rect x="1" y="1" width="758" height="558" rx="27" fill="none" stroke="#38BDF8" stroke-opacity=".18" stroke-width="2"/>

  <!-- tool rail -->
  <rect x="32" y="90" width="72" height="400" rx="24" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
  <g transform="translate(68 130)">
    <rect x="-22" y="-22" width="44" height="44" rx="14" fill="#38BDF8" fill-opacity=".18" stroke="#38BDF8" stroke-opacity=".6" stroke-width="1.5"/>
    <path d="M-9 9 L9 -9 l4 4 L-5 13 z" fill="#38BDF8"/>
  </g>
  <g transform="translate(68 200)" stroke="#64748B" stroke-width="3.5" fill="none">
    <rect x="-15" y="-15" width="30" height="30" rx="7"/>
  </g>
  <g transform="translate(68 268)" stroke="#64748B" stroke-width="3.5" fill="none">
    <circle cx="0" cy="0" r="15"/>
  </g>
  <g transform="translate(68 336)" stroke="#64748B" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M-15 10 L15 -10"/>
  </g>
  <g transform="translate(68 404)" stroke="#64748B" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-14 12 q8 -26 14 -14 t14 -10"/>
  </g>

  <!-- canvas -->
  <rect x="136" y="90" width="440" height="400" rx="24" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
  <g opacity=".35">
    <path d="M136 170 h440 M136 250 h440 M136 330 h440 M136 410 h440" stroke="#334155" stroke-width="1"/>
    <path d="M216 90 v400 M296 90 v400 M376 90 v400 M456 90 v400 M536 90 v400" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- the shape being drawn: a bezier path with handles -->
  <path d="M216 400 C 256 250, 336 250, 376 320 S 496 400, 516 200"
        fill="none" stroke="url(#dw-hi)" stroke-width="9" stroke-linecap="round"/>

  <!-- anchor points -->
  <g fill="#0B1220" stroke="#38BDF8" stroke-width="4">
    <rect x="208" y="392" width="16" height="16" rx="3"/>
    <rect x="368" y="312" width="16" height="16" rx="3"/>
    <rect x="508" y="192" width="16" height="16" rx="3"/>
  </g>
  <!-- control handles on the middle anchor -->
  <g stroke="#38BDF8" stroke-opacity=".6" stroke-width="2.5">
    <path d="M376 320 L316 292"/>
    <path d="M376 320 L436 348"/>
  </g>
  <circle cx="316" cy="292" r="7" fill="#38BDF8"/>
  <circle cx="436" cy="348" r="7" fill="#38BDF8"/>

  <!-- right inspector -->
  <rect x="608" y="90" width="120" height="400" rx="24" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
  <rect x="630" y="120" width="76" height="12" rx="6" fill="#475569"/>
  <rect x="630" y="150" width="76" height="40" rx="12" fill="url(#dw-hi)" fill-opacity=".3" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="630" y="210" width="76" height="12" rx="6" fill="#334155"/>
  <rect x="630" y="236" width="76" height="28" rx="9" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="630" y="284" width="76" height="12" rx="6" fill="#334155"/>
  <rect x="630" y="310" width="76" height="28" rx="9" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="630" y="368" width="76" height="34" rx="17" fill="url(#dw-hi)"/>
</svg>
