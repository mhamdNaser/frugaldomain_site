  <rect x="82" y="50" width="150" height="13" rx="6.5" fill="#475569"/>
  <rect x="760" y="40" width="160" height="34" rx="17" fill="url(#ic-hi)" fill-opacity=".2" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="784" y="50" width="112" height="13" rx="6.5" fill="#38BDF8" fill-opacity=".75"/>

