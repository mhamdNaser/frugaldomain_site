      <path d="M44 40 h44 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 H62 l-14 12 v-12 h-4 a8 8 0 0 1 -8 -8 V48 a8 8 0 0 1 8 -8 z" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linejoin="round"/>
      <rect x="36" y="92" width="60" height="9" rx="4.5" fill="#38BDF8" fill-opacity=".5"/>
    </g>
    <g transform="translate(508 262)">
      <rect width="132" height="122" rx="20" fill="#111C2E" stroke="#334155" stroke-width="1.5"/>
      <path d="M66 76 s-24 -14 -24 -30 a14 14 0 0 1 24 -9 a14 14 0 0 1 24 9 c0 16 -24 30 -24 30 z" fill="none" stroke="#94A3B8" stroke-width="6" stroke-linejoin="round"/>
