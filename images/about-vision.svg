<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="Craft and precision">
  <title>Our approach</title>
  <defs>
    <linearGradient id="av-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="av-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="760" height="560" rx="28" fill="url(#av-bg)"/>
  <rect x="1" y="1" width="758" height="558" rx="27" fill="none" stroke="#38BDF8" stroke-opacity=".18" stroke-width="2"/>

  <!-- concentric precision rings -->
  <g transform="translate(380 280)">
    <circle r="190" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle r="140" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle r="92" fill="none" stroke="#38BDF8" stroke-opacity=".35" stroke-width="2"/>

    <!-- crosshair -->
    <path d="M-210 0 h60 M150 0 h60 M0 -210 v60 M0 150 v60"
          stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <!-- the mark at the centre: a precisely cut glyph -->
    <g fill="url(#av-hi)">
      <rect x="-46" y="-58" width="26" height="116" rx="13"/>
      <rect x="-46" y="-58" width="96" height="26" rx="13"/>
      <rect x="-46" y="-11" width="70" height="26" rx="13"/>
    </g>
    <circle cx="56" cy="42" r="17" fill="#38BDF8"/>
    <circle cx="56" cy="42" r="17" fill="none" stroke="#0F172A" stroke-width="5"/>

    <!-- measurement ticks -->
    <g stroke="#38BDF8" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round">
      <path d="M-92 -128 v-18 M92 -128 v-18"/>
      <path d="M-92 -137 h184"/>
    </g>
  </g>

  <!-- corner spec chips -->
  <g transform="translate(52 56)">
    <rect width="150" height="40" rx="14" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
    <circle cx="26" cy="20" r="7" fill="#38BDF8"/>
    <rect x="44" y="14" width="86" height="12" rx="6" fill="#334155"/>
  </g>
  <g transform="translate(558 56)">
    <rect width="150" height="40" rx="14" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="14" width="60" height="12" rx="6" fill="#475569"/>
    <rect x="90" y="14" width="40" height="12" rx="6" fill="#38BDF8" fill-opacity=".55"/>
  </g>
  <g transform="translate(52 464)">
    <rect width="150" height="40" rx="14" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="14" width="50" height="12" rx="6" fill="#475569"/>
    <rect x="80" y="14" width="50" height="12" rx="6" fill="#334155"/>
  </g>
  <g transform="translate(558 464)">
    <rect width="150" height="40" rx="14" fill="#0B1220" stroke="#38BDF8" stroke-opacity=".4" stroke-width="1.5"/>
    <path d="M22 20 l8 8 16 -18" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="14" width="70" height="12" rx="6" fill="#38BDF8" fill-opacity=".5"/>
  </g>
</svg>
