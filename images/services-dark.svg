<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-hidden="true">
  <!--
    The hero illustration: five services on one line.

    The old drawing showed a file turning into other files, which said the site
    converts things and nothing else. This one names the breadth instead - a
    form, a converter, an icon set, a drawing board and an app - with the form
    first and largest, because it is the service a visitor is least likely to
    expect here.

    The canvas is cropped close to the tiles: it is rendered into a card about
    420px wide, and every pixel of margin in the artwork is a pixel the tiles
    do not get. No text, so it needs no translation and reads the same right
    to left.
  -->
  <defs>
    <linearGradient id="svc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#0d1526" />
    </linearGradient>

    <linearGradient id="svc-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="svc-thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="22%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="78%" stop-color="#2563eb" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>

    <filter id="svc-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1180" height="470" rx="26" fill="url(#svc-bg)" />

  <!-- the same faint grid the hero uses behind its headline -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <path d="M0 94H1180M0 188H1180M0 282H1180M0 376H1180" />
    <path d="M98 0V470M196 0V470M294 0V470M392 0V470M490 0V470M588 0V470M686 0V470M784 0V470M882 0V470M980 0V470M1078 0V470" />
  </g>

  <!-- the thread that joins them -->
  <path d="M176 262 C 300 176, 420 176, 530 232 S 790 300, 900 226 S 1030 170, 1062 198"
        fill="none" stroke="url(#svc-thread)" stroke-width="3.5" stroke-linecap="round"
        filter="url(#svc-glow)" opacity="0.9" />

  <!-- 1. a form: the service a visitor is least likely to expect here, so it leads -->
  <g transform="translate(54 70)">
    <rect width="272" height="316" rx="26" fill="#111c31" stroke="#1e3357" stroke-width="2.5" />
    <rect x="34" y="42" width="136" height="16" rx="8" fill="#38bdf8" opacity="0.9" />
    <rect x="34" y="88" width="204" height="40" rx="12" fill="#0b1220" stroke="#24395f" stroke-width="2.5" />
    <rect x="34" y="146" width="204" height="40" rx="12" fill="#0b1220" stroke="#24395f" stroke-width="2.5" />
    <rect x="34" y="204" width="122" height="40" rx="12" fill="#0b1220" stroke="#24395f" stroke-width="2.5" />
    <!-- the tick that means it was sent -->
    <circle cx="206" cy="242" r="26" fill="url(#svc-accent)" />
    <path d="M194 242l8 8 16-17" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 2. converting: one thing becoming another -->
  <g transform="translate(372 128)">
    <rect width="212" height="212" rx="24" fill="#111c31" stroke="#1e3357" stroke-width="2.5" />
    <path d="M58 86h88l-24-24" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M154 128H66l24 24" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 3. the icon library -->
  <g transform="translate(628 104)">
    <rect width="244" height="244" rx="24" fill="#111c31" stroke="#1e3357" stroke-width="2.5" />
    <circle cx="78" cy="78" r="26" fill="none" stroke="#38bdf8" stroke-width="6" />
    <rect x="140" y="52" width="52" height="52" rx="12" fill="none" stroke="#7dd3fc" stroke-width="6" />
    <path d="M78 140l28 50H50z" fill="none" stroke="#2563eb" stroke-width="6" stroke-linejoin="round" />
    <path d="M166 140v52M140 166h52" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- 4. the drawing board: a curve with its handles -->
  <g transform="translate(916 128)">
    <rect width="212" height="212" rx="24" fill="#111c31" stroke="#1e3357" stroke-width="2.5" />
    <path d="M50 152C80 66 132 66 162 152" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <circle cx="50" cy="152" r="10" fill="#0b1220" stroke="#7dd3fc" stroke-width="4.5" />
    <circle cx="162" cy="152" r="10" fill="#0b1220" stroke="#7dd3fc" stroke-width="4.5" />
    <circle cx="106" cy="74" r="8" fill="#2563eb" />
  </g>
</svg>
