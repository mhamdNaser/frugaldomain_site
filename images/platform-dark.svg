<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 520" role="img" aria-label="Fruga platform">
  <title>Fruga platform</title>
  <defs>
    <linearGradient id="pl-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="pl-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pl-arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="pl-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- sweeping arc: the conversion motion -->
  <path d="M40 430 C 300 470, 430 150, 690 210 S 1080 400, 1330 150"
        fill="none" stroke="url(#pl-arc)" stroke-width="26" stroke-linecap="round" filter="url(#pl-glow)"/>

  <!-- source: a file card -->
  <g transform="translate(150 118)">
    <rect width="250" height="300" rx="28" fill="url(#pl-card)" stroke="#38BDF8" stroke-opacity=".35" stroke-width="2"/>
    <rect x="36" y="56" width="150" height="16" rx="8" fill="#38BDF8" fill-opacity=".55"/>
    <rect x="36" y="96" width="178" height="16" rx="8" fill="#64748B" fill-opacity=".55"/>
    <rect x="36" y="136" width="120" height="16" rx="8" fill="#64748B" fill-opacity=".4"/>
    <circle cx="125" cy="228" r="44" fill="none" stroke="#38BDF8" stroke-width="10" stroke-opacity=".85"/>
    <path d="M105 228 l16 16 32 -36" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- transform core -->
  <g transform="translate(620 150)">
    <rect width="240" height="240" rx="62" fill="url(#pl-sky)" opacity=".16"/>
    <rect x="26" y="26" width="188" height="188" rx="50" fill="url(#pl-card)" stroke="#38BDF8" stroke-opacity=".5" stroke-width="2"/>
    <g stroke="#38BDF8" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M84 104 h58 l-20 -22"/>
      <path d="M156 136 h-58 l20 22"/>
    </g>
  </g>

  <!-- output: stacked results -->
  <g transform="translate(1000 118)">
    <rect x="34" y="34" width="220" height="270" rx="26" fill="#0B1220" stroke="#334155" stroke-width="2"/>
    <rect x="17" y="17" width="220" height="270" rx="26" fill="#111C2E" stroke="#3B4A61" stroke-width="2"/>
    <rect width="220" height="270" rx="26" fill="url(#pl-card)" stroke="#38BDF8" stroke-opacity=".45" stroke-width="2"/>
    <rect x="34" y="52" width="128" height="15" rx="7" fill="#38BDF8" fill-opacity=".6"/>
    <rect x="34" y="88" width="152" height="15" rx="7" fill="#64748B" fill-opacity=".5"/>
    <g transform="translate(72 150)">
      <rect width="76" height="76" rx="20" fill="#38BDF8" fill-opacity=".18" stroke="#38BDF8" stroke-opacity=".7" stroke-width="3"/>
      <path d="M22 46 l14 -18 14 18 12 -14" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
