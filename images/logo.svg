<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fruga">
  <title>Fruga</title>
  <defs>
    <linearGradient id="fg-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="fg-spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- charcoal plate -->
  <rect width="512" height="512" rx="116" fill="url(#fg-plate)"/>
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="#38BDF8" stroke-opacity=".22" stroke-width="2"/>

  <!-- monogram F: stem + two arms, cut from the plate in electric blue -->
  <g fill="url(#fg-spark)">
    <rect x="150" y="128" width="46" height="256" rx="23"/>
    <rect x="150" y="128" width="212" height="46" rx="23"/>
    <rect x="150" y="233" width="156" height="46" rx="23"/>
  </g>

  <!-- conversion spark: the dot that turns one form into another -->
  <circle cx="340" cy="352" r="30" fill="#38BDF8"/>
  <circle cx="340" cy="352" r="30" fill="none" stroke="#0B1220" stroke-width="8"/>
</svg>
