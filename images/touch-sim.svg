<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="Touch gesture simulator">
  <title>Touch simulator</title>
  <defs>
    <linearGradient id="ts-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ts-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="ts-ripple">
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity=".55"/>
    </radialGradient>
  </defs>

  <rect width="760" height="560" rx="28" fill="url(#ts-bg)"/>
  <rect x="1" y="1" width="758" height="558" rx="27" fill="none" stroke="#38BDF8" stroke-opacity=".18" stroke-width="2"/>

  <!-- phone frame -->
  <rect x="250" y="60" width="260" height="440" rx="42" fill="#0B1220" stroke="#38BDF8" stroke-opacity=".35" stroke-width="2.5"/>
  <rect x="266" y="76" width="228" height="408" rx="30" fill="#111C2E"/>
  <rect x="342" y="86" width="76" height="10" rx="5" fill="#0B1220"/>

  <!-- app content behind the gesture -->
  <rect x="292" y="124" width="120" height="14" rx="7" fill="#475569"/>
  <rect x="292" y="150" width="176" height="11" rx="5.5" fill="#334155"/>
  <rect x="292" y="188" width="176" height="96" rx="16" fill="#0F2437" stroke="#334155" stroke-width="1.5"/>
  <rect x="292" y="300" width="82" height="82" rx="16" fill="#0F2437" stroke="#334155" stroke-width="1.5"/>
  <rect x="386" y="300" width="82" height="82" rx="16" fill="#0F2437" stroke="#334155" stroke-width="1.5"/>
  <rect x="292" y="404" width="176" height="40" rx="20" fill="url(#ts-hi)" fill-opacity=".28" stroke="#38BDF8" stroke-opacity=".45" stroke-width="1.5"/>

  <!-- swipe path -->
  <path d="M330 360 C 350 300, 410 288, 436 228"
        fill="none" stroke="#38BDF8" stroke-opacity=".7" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="1 14"/>

  <!-- touch point with ripple -->
  <circle cx="436" cy="228" r="54" fill="url(#ts-ripple)"/>
  <circle cx="436" cy="228" r="26" fill="none" stroke="#38BDF8" stroke-opacity=".65" stroke-width="3"/>
  <circle cx="436" cy="228" r="14" fill="#38BDF8"/>
  <circle cx="330" cy="360" r="11" fill="none" stroke="#38BDF8" stroke-opacity=".6" stroke-width="3"/>

  <!-- gesture legend -->
  <g transform="translate(56 150)">
    <rect width="150" height="240" rx="22" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="28" width="90" height="12" rx="6" fill="#475569"/>

    <g transform="translate(24 68)">
      <rect width="102" height="36" rx="12" fill="#38BDF8" fill-opacity=".16" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1.5"/>
      <circle cx="22" cy="18" r="7" fill="#38BDF8"/>
      <rect x="40" y="12" width="44" height="11" rx="5.5" fill="#38BDF8" fill-opacity=".55"/>
    </g>
    <g transform="translate(24 118)">
      <rect width="102" height="36" rx="12" fill="#111C2E" stroke="#334155" stroke-width="1.5"/>
      <path d="M14 18 h18" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
      <rect x="40" y="12" width="44" height="11" rx="5.5" fill="#334155"/>
    </g>
    <g transform="translate(24 168)">
      <rect width="102" height="36" rx="12" fill="#111C2E" stroke="#334155" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="6" fill="none" stroke="#64748B" stroke-width="3"/>
      <circle cx="30" cy="18" r="6" fill="none" stroke="#64748B" stroke-width="3"/>
      <rect x="44" y="12" width="40" height="11" rx="5.5" fill="#334155"/>
    </g>
  </g>

  <!-- event stream -->
  <g transform="translate(554 150)">
    <rect width="150" height="240" rx="22" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="28" width="70" height="12" rx="6" fill="#475569"/>
    <g font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#7DD3FC">
      <text x="24" y="76">touchstart</text>
      <text x="24" y="104" fill="#64748B">touchmove</text>
      <text x="24" y="132" fill="#64748B">touchmove</text>
      <text x="24" y="160" fill="#64748B">touchend</text>
      <text x="24" y="196" fill="#475569">swipe ↑</text>
    </g>
  </g>
</svg>
