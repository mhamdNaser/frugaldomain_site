<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="Image conversion between formats">
  <title>Image conversion</title>
  <defs>
    <linearGradient id="cv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cv-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cv-photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity=".45"/>
    </linearGradient>
  </defs>

  <rect width="960" height="560" rx="28" fill="url(#cv-bg)"/>
  <rect x="1" y="1" width="958" height="558" rx="27" fill="none" stroke="#38BDF8" stroke-opacity=".18" stroke-width="2"/>

  <!-- source image card -->
  <g transform="translate(70 120)">
    <rect width="300" height="320" rx="24" fill="#0B1220" stroke="#334155" stroke-width="2"/>
    <rect x="24" y="24" width="252" height="186" rx="14" fill="url(#cv-photo)"/>
    <!-- little mountain + sun to read as a photo -->
    <circle cx="92" cy="82" r="20" fill="#E0F2FE" fill-opacity=".85"/>
    <path d="M24 210 v-34 l62 -62 58 60 40 -38 92 74 v0 z" fill="#0F172A" fill-opacity=".55"/>
    <rect x="24" y="232" width="150" height="15" rx="7.5" fill="#475569"/>
    <rect x="24" y="260" width="96" height="13" rx="6.5" fill="#334155"/>
    <g transform="translate(196 240)">
      <rect width="80" height="34" rx="17" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <text x="40" y="23" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#94A3B8" text-anchor="middle">PNG</text>
    </g>
  </g>

  <!-- conversion engine -->
  <g transform="translate(420 210)">
    <rect width="120" height="120" rx="34" fill="url(#cv-hi)" fill-opacity=".14"/>
    <rect x="14" y="14" width="92" height="92" rx="26" fill="#0B1220" stroke="#38BDF8" stroke-opacity=".55" stroke-width="2"/>
    <g stroke="#38BDF8" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M40 50 h30 l-11 -12"/>
      <path d="M80 70 h-30 l11 12"/>
    </g>
  </g>

  <!-- arrows -->
  <path d="M382 270 h26" stroke="#38BDF8" stroke-opacity=".6" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <path d="M552 270 h26" stroke="#38BDF8" stroke-opacity=".6" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>

  <!-- output formats -->
  <g transform="translate(590 120)">
    <rect x="0" y="0" width="300" height="88" rx="20" fill="#111C2E" stroke="#38BDF8" stroke-opacity=".45" stroke-width="2"/>
    <rect x="24" y="30" width="120" height="14" rx="7" fill="#38BDF8" fill-opacity=".65"/>
    <rect x="24" y="54" width="80" height="12" rx="6" fill="#334155"/>
    <g transform="translate(206 27)">
      <rect width="70" height="34" rx="17" fill="#38BDF8" fill-opacity=".18" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1.5"/>
      <text x="35" y="23" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#7DD3FC" text-anchor="middle">WEBP</text>
    </g>

    <rect x="0" y="106" width="300" height="88" rx="20" fill="#111C2E" stroke="#334155" stroke-width="2"/>
    <rect x="24" y="136" width="120" height="14" rx="7" fill="#475569"/>
    <rect x="24" y="160" width="80" height="12" rx="6" fill="#334155"/>
    <g transform="translate(206 133)">
      <rect width="70" height="34" rx="17" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <text x="35" y="23" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#94A3B8" text-anchor="middle">JPG</text>
    </g>

    <rect x="0" y="212" width="300" height="88" rx="20" fill="#111C2E" stroke="#334155" stroke-width="2"/>
    <rect x="24" y="242" width="120" height="14" rx="7" fill="#475569"/>
    <rect x="24" y="266" width="80" height="12" rx="6" fill="#334155"/>
    <g transform="translate(206 239)">
      <rect width="70" height="34" rx="17" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <text x="35" y="23" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#94A3B8" text-anchor="middle">SVG</text>
    </g>
  </g>
</svg>
