<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="Business management applications">
  <title>Management applications</title>
  <defs>
    <linearGradient id="ap-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ap-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="ap-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity=".95"/>
    </linearGradient>
  </defs>

  <rect width="960" height="560" rx="28" fill="url(#ap-bg)"/>
  <rect x="1" y="1" width="958" height="558" rx="27" fill="none" stroke="#38BDF8" stroke-opacity=".18" stroke-width="2"/>

  <!-- app window -->
  <rect x="58" y="54" width="620" height="452" rx="22" fill="#0B1220" stroke="#334155" stroke-width="2"/>

  <!-- title bar -->
  <path d="M58 76a22 22 0 0 1 22-22h576a22 22 0 0 1 22 22v26H58z" fill="#111C2E"/>
  <circle cx="86" cy="78" r="5.5" fill="#475569"/>
  <circle cx="104" cy="78" r="5.5" fill="#475569"/>
  <circle cx="122" cy="78" r="5.5" fill="#38BDF8" fill-opacity=".8"/>
  <rect x="150" y="71" width="150" height="14" rx="7" fill="#1E293B"/>

  <!-- side nav -->
  <rect x="58" y="102" width="138" height="404" fill="#0D1526"/>
  <rect x="80" y="128" width="94" height="12" rx="6" fill="#38BDF8" fill-opacity=".65"/>
  <rect x="80" y="162" width="78" height="10" rx="5" fill="#334155"/>
  <rect x="80" y="190" width="94" height="10" rx="5" fill="#334155"/>
  <rect x="80" y="218" width="66" height="10" rx="5" fill="#334155"/>
  <rect x="80" y="246" width="86" height="10" rx="5" fill="#334155"/>
  <rect x="72" y="278" width="110" height="30" rx="10" fill="url(#ap-hi)" fill-opacity=".22" stroke="#38BDF8" stroke-opacity=".45" stroke-width="1.5"/>
  <rect x="86" y="288" width="72" height="10" rx="5" fill="#7DD3FC"/>
  <rect x="80" y="326" width="82" height="10" rx="5" fill="#334155"/>
  <rect x="80" y="354" width="94" height="10" rx="5" fill="#334155"/>

  <!-- KPI cards -->
  <g>
    <rect x="220" y="128" width="130" height="78" rx="14" fill="#111C2E" stroke="#334155" stroke-width="1.5"/>
    <rect x="240" y="150" width="46" height="9" rx="4.5" fill="#475569"/>
    <rect x="240" y="170" width="70" height="16" rx="8" fill="#38BDF8" fill-opacity=".75"/>
  </g>
  <g>
    <rect x="366" y="128" width="130" height="78" rx="14" fill="#111C2E" stroke="#334155" stroke-width="1.5"/>
    <rect x="386" y="150" width="52" height="9" rx="4.5" fill="#475569"/>
    <rect x="386" y="170" width="60" height="16" rx="8" fill="#64748B"/>
  </g>
  <g>
    <rect x="512" y="128" width="130" height="78" rx="14" fill="#111C2E" stroke="#334155" stroke-width="1.5"/>
    <rect x="532" y="150" width="40" height="9" rx="4.5" fill="#475569"/>
    <rect x="532" y="170" width="78" height="16" rx="8" fill="#64748B"/>
  </g>

  <!-- chart panel -->
  <rect x="220" y="226" width="422" height="164" rx="16" fill="#111C2E" stroke="#334155" stroke-width="1.5"/>
  <rect x="244" y="250" width="96" height="10" rx="5" fill="#475569"/>
  <g>
    <rect x="248" y="330" width="34" height="38" rx="6" fill="url(#ap-bar)"/>
    <rect x="300" y="308" width="34" height="60" rx="6" fill="url(#ap-bar)"/>
    <rect x="352" y="322" width="34" height="46" rx="6" fill="url(#ap-bar)"/>
    <rect x="404" y="288" width="34" height="80" rx="6" fill="url(#ap-bar)"/>
    <rect x="456" y="300" width="34" height="68" rx="6" fill="url(#ap-bar)"/>
    <rect x="508" y="278" width="34" height="90" rx="6" fill="#38BDF8"/>
    <rect x="560" y="296" width="34" height="72" rx="6" fill="url(#ap-bar)"/>
  </g>

  <!-- table rows -->
  <rect x="220" y="410" width="422" height="76" rx="16" fill="#111C2E" stroke="#334155" stroke-width="1.5"/>
  <rect x="244" y="432" width="150" height="10" rx="5" fill="#334155"/>
  <rect x="244" y="458" width="200" height="10" rx="5" fill="#1E293B"/>
  <rect x="556" y="428" width="62" height="18" rx="9" fill="#38BDF8" fill-opacity=".2" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1.5"/>

  <!-- floating cards: the other apps in the catalogue -->
  <g transform="translate(714 128)">
    <rect width="190" height="106" rx="18" fill="#111C2E" stroke="#38BDF8" stroke-opacity=".45" stroke-width="2"/>
    <rect x="22" y="24" width="34" height="34" rx="11" fill="#38BDF8" fill-opacity=".2"/>
    <rect x="70" y="30" width="86" height="11" rx="5.5" fill="#7DD3FC"/>
    <rect x="70" y="48" width="60" height="9" rx="4.5" fill="#334155"/>
    <rect x="22" y="74" width="146" height="9" rx="4.5" fill="#1E293B"/>
  </g>
  <g transform="translate(714 254)">
    <rect width="190" height="106" rx="18" fill="#111C2E" stroke="#334155" stroke-width="2"/>
    <rect x="22" y="24" width="34" height="34" rx="11" fill="#334155"/>
    <rect x="70" y="30" width="72" height="11" rx="5.5" fill="#475569"/>
    <rect x="70" y="48" width="52" height="9" rx="4.5" fill="#334155"/>
    <rect x="22" y="74" width="146" height="9" rx="4.5" fill="#1E293B"/>
  </g>
  <g transform="translate(714 380)">
    <rect width="190" height="106" rx="18" fill="#0F1A2B" stroke="#334155" stroke-width="2"/>
    <rect x="22" y="24" width="34" height="34" rx="11" fill="#1E293B"/>
    <rect x="70" y="30" width="64" height="11" rx="5.5" fill="#3B4A61"/>
    <rect x="70" y="48" width="46" height="9" rx="4.5" fill="#1E293B"/>
    <rect x="22" y="74" width="146" height="9" rx="4.5" fill="#16233A"/>
  </g>
</svg>
